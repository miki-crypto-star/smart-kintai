<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スマート勤怠</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#111827}
    .wrap{max-width:520px;margin:0 auto}
    .card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 16px rgba(0,0,0,.08)}
    h1{font-size:24px;margin:10px 0}
    h2{font-size:18px;margin:0 0 12px}
    label{display:block;font-weight:700;margin-top:12px}
    input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px}
    button{width:100%;padding:13px;font-size:16px;font-weight:700;border:0;border-radius:12px;margin-top:14px;cursor:pointer}
    .primary{background:#2563eb;color:#fff}
    .dark{background:#111827;color:#fff}
    .gray{background:#e5e7eb;color:#111827}
    .msg{margin-top:12px;font-weight:700;white-space:pre-wrap}
    .small{font-size:13px;color:#6b7280;line-height:1.6}
    .hidden{display:none}
  </style>
</head>
<body>
<div class="wrap">
  <h1>スマート勤怠</h1>

  <div class="card">
    <h2>従業員ログイン</h2>

    <label>会社コード</label>
    <input id="workerCompanyCode" placeholder="例：sample-company">

    <label>社員コードまたは氏名</label>
    <input id="workerCode" placeholder="例：岸澤 / 001 / A001">

    <label>個別パスワード</label>
    <input id="workerPasscode" type="password" placeholder="個別パスワード">

    <button class="primary" id="workerLoginBtn">従業員としてログイン</button>
    <div class="msg" id="workerMsg"></div>
  </div>

  <div class="card">
    <h2>管理者ログイン</h2>

    <label>会社コード</label>
    <input id="adminCompanyCode" placeholder="例：sample-company">

    <label>メールアドレス</label>
    <input id="adminEmail" type="email" placeholder="admin@example.com">

    <label>パスワード</label>
    <input id="adminPassword" type="password" placeholder="パスワード">

    <button class="dark" id="adminLoginBtn">管理者としてログイン</button>
    <button class="gray hidden" id="adminGoBtn">管理画面へ進む</button>
    <button class="gray hidden" id="adminLogoutBtn">ログアウト</button>

    <div class="msg" id="adminMsg"></div>
    <p class="small">同じ端末では、管理者のログイン状態を保持します。</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAokZ3FYeL3qjmZOHhVznhwykvyQu8axp8",
    authDomain: "smart-kintai.firebaseapp.com",
    databaseURL: "https://smart-kintai-default-rtdb.firebaseio.com",
    projectId: "smart-kintai",
    storageBucket: "smart-kintai.firebasestorage.app",
    messagingSenderId: "46581025027",
    appId: "1:46581025027:web:80ca643edc2c202d9f4136",
    measurementId: "G-NY70722CRJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const DB_URL = firebaseConfig.databaseURL;

  const $ = (id) => document.getElementById(id);

  function sanitizeKey(value){
    return String(value || "").trim().replace(/[.#$/\[\]]/g, "_");
  }

  function now(){
    return Date.now();
  }

  async function getJson(path){
    const res = await fetch(`${DB_URL}/${path}.json`);
    if(!res.ok) throw new Error("通信に失敗しました");
    return await res.json();
  }

  function setMsg(id, text, isError=false){
    const el = $(id);
    el.textContent = text;
    el.style.color = isError ? "#dc2626" : "#166534";
  }

  function disableButton(btn, disabled, text){
    btn.disabled = disabled;
    btn.textContent = text;
    btn.style.opacity = disabled ? ".6" : "1";
  }

  async function workerLogin(){
    const btn = $("workerLoginBtn");
    const companyCode = sanitizeKey($("workerCompanyCode").value);
    const workerInput = sanitizeKey($("workerCode").value);
    const passcode = $("workerPasscode").value.trim();

    if(!companyCode || !workerInput || !passcode){
      setMsg("workerMsg", "会社コード、社員コードまたは氏名、個別パスワードを入力してください。", true);
      return;
    }

    try{
      disableButton(btn, true, "処理中...");

      const worker = await getJson(`companies/${companyCode}/workers/${workerInput}`);

      if(!worker || worker.active !== true){
        throw new Error("従業員情報が見つかりません。");
      }

      if(String(worker.loginPasscode || "") !== passcode){
        throw new Error("個別パスワードが違います。");
      }

      const loginData = {
        companyCode,
        workerId: workerInput,
        workerCode: worker.code || workerInput,
        workerName: worker.name || workerInput,
        loginAt: now()
      };

      localStorage.setItem("smartKintaiWorkerLogin", JSON.stringify(loginData));
      setMsg("workerMsg", "ログインしました。");

      location.href = `worker.html?company=${encodeURIComponent(companyCode)}&worker=${encodeURIComponent(workerInput)}`;

    }catch(e){
      setMsg("workerMsg", e.message || "ログインできませんでした。", true);
    }finally{
      disableButton(btn, false, "従業員としてログイン");
    }
  }

  async function adminLogin(){
    const btn = $("adminLoginBtn");
    const companyCode = sanitizeKey($("adminCompanyCode").value);
    const email = $("adminEmail").value.trim();
    const password = $("adminPassword").value;

    if(!companyCode || !email || !password){
      setMsg("adminMsg", "会社コード、メールアドレス、パスワードを入力してください。", true);
      return;
    }

    try{
      disableButton(btn, true, "処理中...");

      const cred = await signInWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid;

      const allowed = await getJson(`companies/${companyCode}/admins/${uid}`);

      if(allowed !== true){
        await signOut(auth);
        throw new Error("この会社の管理者として登録されていません。");
      }

      localStorage.setItem("smartKintaiAdminCompanyCode", companyCode);
      setMsg("adminMsg", "管理者ログインしました。");

      location.href = `admin.html?company=${encodeURIComponent(companyCode)}`;

    }catch(e){
      setMsg("adminMsg", e.message || "管理者ログインできませんでした。", true);
    }finally{
      disableButton(btn, false, "管理者としてログイン");
    }
  }

  async function checkAutoLogin(){
    const workerLogin = localStorage.getItem("smartKintaiWorkerLogin");
    if(workerLogin){
      try{
        const data = JSON.parse(workerLogin);
        if(data.companyCode && data.workerId){
          location.href = `worker.html?company=${encodeURIComponent(data.companyCode)}&worker=${encodeURIComponent(data.workerId)}`;
          return;
        }
      }catch(e){}
    }

    onAuthStateChanged(auth, async (user) => {
      const companyCode = localStorage.getItem("smartKintaiAdminCompanyCode");

      if(user && companyCode){
        $("adminGoBtn").classList.remove("hidden");
        $("adminLogoutBtn").classList.remove("hidden");
        setMsg("adminMsg", "管理者ログイン状態を確認しました。");
      }
    });
  }

  $("workerLoginBtn").addEventListener("click", workerLogin);
  $("adminLoginBtn").addEventListener("click", adminLogin);

  $("adminGoBtn").addEventListener("click", () => {
    const companyCode = localStorage.getItem("smartKintaiAdminCompanyCode");
    if(companyCode){
      location.href = `admin.html?company=${encodeURIComponent(companyCode)}`;
    }
  });

  $("adminLogoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    localStorage.removeItem("smartKintaiAdminCompanyCode");
    setMsg("adminMsg", "ログアウトしました。");
    $("adminGoBtn").classList.add("hidden");
    $("adminLogoutBtn").classList.add("hidden");
  });

  checkAutoLogin();
</script>
</body>
</html>
