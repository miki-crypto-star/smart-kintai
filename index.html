<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart勤怠</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: #fff;
      padding: 18px 14px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .9;
    }

    main {
      max-width: 760px;
      margin: 20px auto;
      padding: 0 14px 40px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      background: #111827;
      cursor: pointer;
    }

    button.employee {
      background: #2563eb;
    }

    button.gray {
      background: #6b7280;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .ok {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .ng {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .warn {
      display: block;
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .note {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.7;
    }
  </style>
</head>
<body>

<header>
  <h1>Smart勤怠</h1>
  <p>勤怠管理・集計作業削減・打刻ミス防止</p>
</header>

<main>
  <section class="card">
    <h2>管理者ログイン</h2>

    <label>会社コード</label>
    <input id="adminCompanyCode" value="demo" autocomplete="off">

    <label>メールアドレス</label>
    <input id="adminEmail" type="email" value="admin-demo@smart-kintai.local" autocomplete="email">

    <label>パスワード</label>
    <input id="adminPassword" type="password" value="admin1234" autocomplete="current-password">

    <button id="adminLoginBtn">管理者画面へ</button>
    <div id="adminStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>従業員ログイン</h2>

    <label>会社コード</label>
    <input id="employeeCompanyCode" value="demo" autocomplete="off">

    <label>社員コード または 氏名</label>
    <input id="employeeKeyword" placeholder="管理者から案内された社員コードまたは氏名" autocomplete="off">

    <label>個別パスワード</label>
    <input id="employeePasscode" type="password" placeholder="個別パスワード">

    <button id="employeeLoginBtn" class="employee">従業員画面へ</button>
    <div id="employeeStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>この端末のログイン情報</h2>
    <p class="note">
      同じ端末では、次回から従業員画面へ自動で進みます。共有端末の場合は、使用後にログアウトしてください。
    </p>
    <button id="clearEmployeeAutoLoginBtn" class="gray">この端末の従業員ログイン情報を解除</button>
    <div id="clearStatus" class="status"></div>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    getDatabase,
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAokZ3FYeL3qjmZOHhVznhwykvyQu8axp8",
    authDomain: "smart-kintai.firebaseapp.com",
    databaseURL: "https://smart-kintai-default-rtdb.firebaseio.com",
    projectId: "smart-kintai",
    storageBucket: "smart-kintai.firebasestorage.app",
    messagingSenderId: "46581025027",
    appId: "1:46581025027:web:80ca643edc2c202d9f4136",
    measurementId: "G-NY70722CRJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const $ = (id) => document.getElementById(id);

  function clean(value) {
    return String(value || "").trim();
  }

  function showStatus(id, message, type = "ok") {
    const el = $(id);
    el.textContent = message;
    el.className = "status " + type;
  }

  function safeKey(value) {
    return clean(value).replace(/[.#$/\[\]]/g, "_");
  }

  async function getCompany(companyCode) {
    const snap = await get(ref(db, `companies/${companyCode}`));
    if (!snap.exists()) return null;
    return snap.val();
  }

  async function getMember(companyCode, uid) {
    const snap = await get(ref(db, `companies/${companyCode}/members/${uid}`));
    if (!snap.exists()) return null;
    return snap.val();
  }

  function findEmployee(workers, keyword) {
    const key = clean(keyword);
    if (!workers || !key) return null;

    const safe = safeKey(key);

    if (workers[safe] && workers[safe].active !== false) {
      return {
        employeeId: safe,
        ...workers[safe]
      };
    }

    const found = Object.entries(workers).find(([id, w]) => {
      if (!w || w.active === false) return false;
      return String(w.code || "") === key || String(w.name || "") === key;
    });

    if (!found) return null;

    return {
      employeeId: found[0],
      ...found[1]
    };
  }

  function getSavedEmployeeSession() {
    try {
      return JSON.parse(localStorage.getItem("smart_kintai_employee") || "null");
    } catch {
      return null;
    }
  }

  function getSavedAdminSession() {
    try {
      return JSON.parse(localStorage.getItem("smart_kintai_admin") || "null");
    } catch {
      return null;
    }
  }

  function saveEmployeeSession(data) {
    localStorage.setItem("smart_kintai_employee", JSON.stringify(data));
  }

  $("adminLoginBtn").addEventListener("click", async () => {
    const companyCode = clean($("adminCompanyCode").value);
    const email = clean($("adminEmail").value);
    const password = $("adminPassword").value;

    if (!companyCode || !email || !password) {
      showStatus("adminStatus", "会社コード・メールアドレス・パスワードを入力してください。", "ng");
      return;
    }

    try {
      $("adminLoginBtn").disabled = true;
      $("adminLoginBtn").textContent = "処理中...";
      showStatus("adminStatus", "確認しています。", "ok");

      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;

      const member = await getMember(companyCode, uid);

      if (!member || member.role !== "admin" || member.active !== true) {
        await signOut(auth);
        localStorage.removeItem("smart_kintai_admin");
        showStatus("adminStatus", "管理者として登録されていません。", "ng");
        $("adminLoginBtn").disabled = false;
        $("adminLoginBtn").textContent = "管理者画面へ";
        return;
      }

      localStorage.setItem("smart_kintai_admin", JSON.stringify({
        companyCode,
        uid,
        email,
        role: "admin",
        loginAt: new Date().toISOString()
      }));

      location.href = `admin.html?company=${encodeURIComponent(companyCode)}`;

    } catch (e) {
      console.error(e);
      showStatus("adminStatus", "ログインできません。入力内容を確認してください。", "ng");
      $("adminLoginBtn").disabled = false;
      $("adminLoginBtn").textContent = "管理者画面へ";
    }
  });

  $("employeeLoginBtn").addEventListener("click", async () => {
    const companyCode = clean($("employeeCompanyCode").value);
    const keyword = clean($("employeeKeyword").value);
    const passcode = $("employeePasscode").value;

    if (!companyCode || !keyword || !passcode) {
      showStatus("employeeStatus", "会社コード・社員コードまたは氏名・個別パスワードを入力してください。", "ng");
      return;
    }

    try {
      $("employeeLoginBtn").disabled = true;
      $("employeeLoginBtn").textContent = "処理中...";
      showStatus("employeeStatus", "確認しています。", "ok");

      const company = await getCompany(companyCode);

      if (!company) {
        showStatus("employeeStatus", "会社コードが見つかりません。", "ng");
        $("employeeLoginBtn").disabled = false;
        $("employeeLoginBtn").textContent = "従業員画面へ";
        return;
      }

      const employee = findEmployee(company.workers, keyword);

      if (!employee) {
        showStatus("employeeStatus", "従業員が見つかりません。管理者に確認してください。", "ng");
        $("employeeLoginBtn").disabled = false;
        $("employeeLoginBtn").textContent = "従業員画面へ";
        return;
      }

      if (employee.active === false) {
        showStatus("employeeStatus", "この従業員は無効化されています。", "ng");
        $("employeeLoginBtn").disabled = false;
        $("employeeLoginBtn").textContent = "従業員画面へ";
        return;
      }

      if (String(employee.loginPasscode || "") !== String(passcode)) {
        showStatus("employeeStatus", "個別パスワードが違います。", "ng");
        $("employeeLoginBtn").disabled = false;
        $("employeeLoginBtn").textContent = "従業員画面へ";
        return;
      }

      saveEmployeeSession({
        companyCode,
        employeeId: employee.employeeId,
        employeeCode: employee.code || employee.employeeId,
        employeeName: employee.name || "",
        role: "employee",
        loginAt: new Date().toISOString()
      });

      location.href = `worker.html?company=${encodeURIComponent(companyCode)}&employee=${encodeURIComponent(employee.employeeId)}`;

    } catch (e) {
      console.error(e);
      showStatus("employeeStatus", "ログインできません。時間をおいて再度お試しください。", "ng");
      $("employeeLoginBtn").disabled = false;
      $("employeeLoginBtn").textContent = "従業員画面へ";
    }
  });

  $("clearEmployeeAutoLoginBtn").addEventListener("click", () => {
    localStorage.removeItem("smart_kintai_employee");
    showStatus("clearStatus", "この端末の従業員ログイン情報を解除しました。", "ok");
  });

  window.addEventListener("load", () => {
    const employeeSession = getSavedEmployeeSession();

    if (employeeSession?.companyCode && employeeSession?.employeeId) {
      location.href = `worker.html?company=${encodeURIComponent(employeeSession.companyCode)}&employee=${encodeURIComponent(employeeSession.employeeId)}`;
      return;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      const savedAdmin = getSavedAdminSession();
      const companyCode = savedAdmin?.companyCode || "demo";

      try {
        const member = await getMember(companyCode, user.uid);

        if (member?.role === "admin" && member?.active === true) {
          location.href = `admin.html?company=${encodeURIComponent(companyCode)}`;
        }
      } catch (e) {
        console.warn("自動ログイン確認に失敗しました。", e);
      }
    });
  });
</script>
</body>
</html>
