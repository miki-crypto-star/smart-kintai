<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart勤怠</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: #fff;
      padding: 18px 14px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .9;
    }

    main {
      max-width: 760px;
      margin: 20px auto;
      padding: 0 14px 40px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      background: #111827;
      cursor: pointer;
    }

    button.worker {
      background: #2563eb;
    }

    button.gray {
      background: #6b7280;
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .ok {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .ng {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .warn {
      display: block;
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .note {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.7;
    }
  </style>
</head>

<body>
<header>
  <h1>Smart勤怠</h1>
  <p>勤怠管理DX・総務業務削減・集計自動化</p>
</header>

<main>
  <section class="card">
    <h2>管理者ログイン</h2>
    <p class="note">
      管理者は Firebase Authentication でログインします。
    </p>

    <label>会社コード</label>
    <input id="adminCompanyCode" value="demo" autocomplete="off">

    <label>メールアドレス</label>
    <input id="adminEmail" type="email" value="admin-demo@smart-kintai.local" autocomplete="email">

    <label>パスワード</label>
    <input id="adminPassword" type="password" value="admin1234" autocomplete="current-password">

    <button id="adminLoginBtn">管理者画面へ</button>
    <div id="adminStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>ワーカーログイン</h2>
    <p class="note">
      ワーカーは Firebase Authentication を使いません。会社コード・氏名・個別パスワードでログインします。
      同じ端末では次回から自動ログインします。
    </p>

    <label>会社コード</label>
    <input id="workerCompanyCode" value="demo" autocomplete="off">

    <label>氏名</label>
    <input id="workerName" value="山田太郎" autocomplete="off">

    <label>個別パスワード</label>
    <input id="workerPasscode" type="password" value="1111">

    <button id="workerLoginBtn" class="worker">ワーカー画面へ</button>
    <div id="workerStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>自動ログイン解除</h2>
    <p class="note">
      この端末に保存されたワーカー自動ログイン情報を削除します。
    </p>
    <button id="clearWorkerAutoLoginBtn" class="gray">この端末のワーカー自動ログインを解除</button>
    <div id="clearStatus" class="status"></div>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    getDatabase,
    ref,
    get
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAokZ3FYeL3qjmZOHhVznhwykvyQu8axp8",
    authDomain: "smart-kintai.firebaseapp.com",
    databaseURL: "https://smart-kintai-default-rtdb.firebaseio.com",
    projectId: "smart-kintai",
    storageBucket: "smart-kintai.firebasestorage.app",
    messagingSenderId: "46581025027",
    appId: "1:46581025027:web:80ca643edc2c202d9f4136",
    measurementId: "G-NY70722CRJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const $ = (id) => document.getElementById(id);

  function clean(value) {
    return String(value || "").trim();
  }

  function showStatus(id, message, type = "ok") {
    const el = $(id);
    el.textContent = message;
    el.className = "status " + type;
  }

  async function getMember(companyCode, uid) {
    const snap = await get(ref(db, `companies/${companyCode}/members/${uid}`));
    if (!snap.exists()) return null;
    return snap.val();
  }

  async function getCompany(companyCode) {
    const snap = await get(ref(db, `companies/${companyCode}`));
    if (!snap.exists()) return null;
    return snap.val();
  }

  function findWorkerByNameAndPasscode(workers, name, passcode) {
    const inputName = clean(name);
    const inputPasscode = String(passcode || "");

    if (!workers || !inputName || !inputPasscode) return null;

    const found = Object.entries(workers).find(([workerId, worker]) => {
      if (!worker) return false;
      if (worker.active === false) return false;

      const workerName = String(worker.name || "");
      const workerPasscode = String(worker.loginPasscode || "");

      return workerName === inputName && workerPasscode === inputPasscode;
    });

    if (!found) return null;

    return {
      workerId: found[0],
      ...found[1]
    };
  }

  function getSavedWorkerSession() {
    try {
      return JSON.parse(localStorage.getItem("smart_kintai_worker") || "null");
    } catch {
      return null;
    }
  }

  function getSavedAdminSession() {
    try {
      return JSON.parse(localStorage.getItem("smart_kintai_admin") || "null");
    } catch {
      return null;
    }
  }

  function saveWorkerSession(data) {
    localStorage.setItem("smart_kintai_worker", JSON.stringify(data));
  }

  $("adminLoginBtn").addEventListener("click", async () => {
    const companyCode = clean($("adminCompanyCode").value);
    const email = clean($("adminEmail").value);
    const password = $("adminPassword").value;

    if (!companyCode || !email || !password) {
      showStatus("adminStatus", "会社コード・メールアドレス・パスワードを入力してください。", "ng");
      return;
    }

    try {
      showStatus("adminStatus", "管理者ログイン確認中です。", "ok");

      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;

      const member = await getMember(companyCode, uid);

      if (!member || member.role !== "admin" || member.active !== true) {
        await signOut(auth);
        localStorage.removeItem("smart_kintai_admin");
        showStatus("adminStatus", "このユーザーは管理者として登録されていません。", "ng");
        return;
      }

      localStorage.setItem("smart_kintai_admin", JSON.stringify({
        companyCode,
        uid,
        email,
        role: "admin",
        loginAt: new Date().toISOString()
      }));

      location.href = `admin.html?company=${encodeURIComponent(companyCode)}`;

    } catch (e) {
      console.error(e);
      showStatus("adminStatus", "管理者ログインできません。メール・パスワード・Firebase Rulesを確認してください。", "ng");
    }
  });

  $("workerLoginBtn").addEventListener("click", async () => {
    const companyCode = clean($("workerCompanyCode").value);
    const name = clean($("workerName").value);
    const passcode = $("workerPasscode").value;

    if (!companyCode || !name || !passcode) {
      showStatus("workerStatus", "会社コード・氏名・個別パスワードを入力してください。", "ng");
      return;
    }

    try {
      showStatus("workerStatus", "ワーカーログイン確認中です。", "ok");

      const company = await getCompany(companyCode);

      if (!company) {
        showStatus("workerStatus", "会社コードが見つかりません。", "ng");
        return;
      }

      const worker = findWorkerByNameAndPasscode(company.workers, name, passcode);

      if (!worker) {
        showStatus("workerStatus", "氏名または個別パスワードが違います。", "ng");
        return;
      }

      saveWorkerSession({
        companyCode,
        workerId: worker.workerId,
        workerName: worker.name || "",
        role: "worker",
        loginAt: new Date().toISOString()
      });

      location.href = `worker.html?company=${encodeURIComponent(companyCode)}&worker=${encodeURIComponent(worker.workerId)}`;

    } catch (e) {
      console.error(e);
      showStatus("workerStatus", "ワーカーログインできません。Firebase Rulesまたは初期データを確認してください。", "ng");
    }
  });

  $("clearWorkerAutoLoginBtn").addEventListener("click", () => {
    localStorage.removeItem("smart_kintai_worker");
    showStatus("clearStatus", "この端末のワーカー自動ログインを解除しました。", "ok");
  });

  window.addEventListener("load", () => {
    const workerSession = getSavedWorkerSession();

    if (workerSession?.companyCode && workerSession?.workerId) {
      location.href = `worker.html?company=${encodeURIComponent(workerSession.companyCode)}&worker=${encodeURIComponent(workerSession.workerId)}`;
      return;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;

      const savedAdmin = getSavedAdminSession();
      const companyCode = savedAdmin?.companyCode || "demo";

      try {
        const member = await getMember(companyCode, user.uid);

        if (member?.role === "admin" && member?.active === true) {
          location.href = `admin.html?company=${encodeURIComponent(companyCode)}`;
        }
      } catch (e) {
        console.warn("自動管理者ログイン確認に失敗しました。", e);
      }
    });
  });
</script>
</body>
</html>
