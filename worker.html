<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>従業員画面｜スマート勤怠</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;padding:14px;color:#111827}
    .wrap{max-width:760px;margin:0 auto}
    .card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.08)}
    h1{font-size:22px;margin:8px 0}
    h2{font-size:17px;margin:0 0 10px}
    label{display:block;font-weight:700;margin-top:10px}
    input,select,textarea{width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid #d1d5db;border-radius:10px;margin-top:5px}
    textarea{min-height:80px}
    button{width:100%;padding:14px;font-size:17px;font-weight:800;border:0;border-radius:14px;margin-top:10px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .in{background:#2563eb;color:#fff}
    .out{background:#dc2626;color:#fff}
    .gray{background:#e5e7eb;color:#111827}
    .green{background:#16a34a;color:#fff}
    .msg{margin-top:10px;font-weight:800;white-space:pre-wrap}
    .ok{color:#166534}
    .ng{color:#dc2626}
    .small{font-size:13px;color:#6b7280;line-height:1.6}
    .pill{display:inline-block;background:#eef2ff;color:#3730a3;padding:6px 10px;border-radius:999px;font-weight:700;font-size:13px;margin:3px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;vertical-align:top}
    th{background:#f9fafb}
  </style>
</head>
<body>
<div class="wrap">
  <h1>従業員画面</h1>

  <div class="card">
    <h2>ログイン情報</h2>
    <div id="loginInfo"></div>
    <button class="gray" id="logoutBtn">ログアウト</button>
  </div>

  <div class="card">
    <h2>本日の打刻</h2>
    <div id="todayInfo" class="small"></div>

    <button class="in" id="clockInBtn">出勤</button>

    <button class="out" id="clockOutBtn">退勤</button>
    <div class="small">退勤は誤タップ防止のため、1.2秒長押ししてください。</div>

    <div class="msg" id="clockMsg"></div>
  </div>

  <div class="card">
    <h2>申請</h2>

    <label>申請種別</label>
    <select id="requestType">
      <option value="early_work">早出申請</option>
      <option value="overtime">残業申請</option>
      <option value="holiday_work">休日出勤申請</option>
      <option value="clock_fix">打刻修正申請</option>
    </select>

    <label>日付</label>
    <input id="requestDate" type="date">

    <label>開始時刻</label>
    <input id="requestStart" type="time">

    <label>終了時刻</label>
    <input id="requestEnd" type="time">

    <label>理由</label>
    <textarea id="requestReason" placeholder="理由を入力してください"></textarea>

    <button class="green" id="sendRequestBtn">申請する</button>
    <div class="msg" id="requestMsg"></div>
  </div>

  <div class="card">
    <h2>自分の打刻エラー</h2>
    <div id="errorList" class="small">読み込み中...</div>
  </div>
</div>

<script type="module">
  const firebaseConfig = {
    apiKey: "AIzaSyAokZ3FYeL3qjmZOHhVznhwykvyQu8axp8",
    authDomain: "smart-kintai.firebaseapp.com",
    databaseURL: "https://smart-kintai-default-rtdb.firebaseio.com",
    projectId: "smart-kintai",
    storageBucket: "smart-kintai.firebasestorage.app",
    messagingSenderId: "46581025027",
    appId: "1:46581025027:web:80ca643edc2c202d9f4136",
    measurementId: "G-NY70722CRJ"
  };

  const DB_URL = firebaseConfig.databaseURL;
  const $ = id => document.getElementById(id);

  let companyCode = "";
  let workerId = "";
  let worker = null;
  let todayAttendance = null;
  let holdTimer = null;
  let holdDone = false;

  function sanitizeKey(value){
    return String(value || "").trim().replace(/[.#$/\[\]]/g, "_");
  }

  function pad(n){ return String(n).padStart(2,"0"); }

  function ymd(date=new Date()){
    return `${date.getFullYear()}${pad(date.getMonth()+1)}${pad(date.getDate())}`;
  }

  function ym(date=new Date()){
    return `${date.getFullYear()}${pad(date.getMonth()+1)}`;
  }

  function dateText(date=new Date()){
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
  }

  function timeText(date=new Date()){
    return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function now(){ return Date.now(); }

  function setMsg(id,text,isError=false){
    const el=$(id);
    el.textContent=text;
    el.className="msg " + (isError ? "ng" : "ok");
  }

  function disableButton(btn, disabled, text){
    btn.disabled = disabled;
    btn.textContent = text;
  }

  async function getJson(path){
    const res = await fetch(`${DB_URL}/${path}.json`);
    if(!res.ok) throw new Error("通信に失敗しました");
    return await res.json();
  }

  async function putJson(path,data){
    const res = await fetch(`${DB_URL}/${path}.json`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    if(!res.ok) throw new Error("保存に失敗しました");
    return await res.json();
  }

  async function patchJson(path,data){
    const res = await fetch(`${DB_URL}/${path}.json`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    if(!res.ok) throw new Error("保存に失敗しました");
    return await res.json();
  }

  async function postJson(path,data){
    const res = await fetch(`${DB_URL}/${path}.json`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    });
    if(!res.ok) throw new Error("保存に失敗しました");
    return await res.json();
  }

  function getQuery(){
    const p = new URLSearchParams(location.search);
    return {
      company: sanitizeKey(p.get("company")),
      worker: sanitizeKey(p.get("worker"))
    };
  }

  function getPosition(){
    return new Promise((resolve,reject)=>{
      if(!navigator.geolocation){
        reject(new Error("位置情報を利用できません。"));
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos=>{
          resolve({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy || null,
            recordedAt: now()
          });
        },
        ()=>{
          reject(new Error("位置情報を確認できませんでした。端末の位置情報設定を確認してください。"));
        },
        {enableHighAccuracy:true,timeout:15000,maximumAge:0}
      );
    });
  }

  function getDistanceMeters(lat1,lng1,lat2,lng2){
    const R=6371000;
    const toRad=x=>x*Math.PI/180;
    const dLat=toRad(lat2-lat1);
    const dLng=toRad(lng2-lng1);
    const a=Math.sin(dLat/2)**2+
      Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  async function loadLogin(){
    const q = getQuery();
    const saved = localStorage.getItem("smartKintaiWorkerLogin");

    if(q.company && q.worker){
      companyCode = q.company;
      workerId = q.worker;
    }else if(saved){
      try{
        const data = JSON.parse(saved);
        companyCode = sanitizeKey(data.companyCode);
        workerId = sanitizeKey(data.workerId);
      }catch(e){}
    }

    if(!companyCode || !workerId){
      location.href = "index.html";
      return;
    }

    worker = await getJson(`companies/${companyCode}/workers/${workerId}`);

    if(!worker || worker.active !== true){
      localStorage.removeItem("smartKintaiWorkerLogin");
      alert("従業員情報が確認できません。");
      location.href = "index.html";
      return;
    }

    localStorage.setItem("smartKintaiWorkerLogin", JSON.stringify({
      companyCode,
      workerId,
      workerCode: worker.code || workerId,
      workerName: worker.name || workerId,
      loginAt: now()
    }));

    $("loginInfo").innerHTML = `
      <span class="pill">会社コード：${companyCode}</span>
      <span class="pill">社員コード：${worker.code || workerId}</span>
      <span class="pill">氏名：${worker.name || workerId}</span>
      <span class="pill">区分：${worker.employmentType || ""}</span>
    `;

    $("requestDate").value = dateText();
  }

  async function loadToday(){
    const path = `companies/${companyCode}/attendance/${ym()}/${workerId}/${ymd()}`;
    todayAttendance = await getJson(path);

    $("todayInfo").innerHTML = `
      日付：${dateText()}<br>
      出勤：${todayAttendance?.inTime || "未打刻"}<br>
      退勤：${todayAttendance?.outTime || "未打刻"}<br>
      所定時間：${worker.workStart || "未設定"} 〜 ${worker.workEnd || "未設定"}
    `;
  }

  async function createError(type,title,message,gps=null){
    const error = {
      workerId,
      workerCode: worker.code || workerId,
      workerName: worker.name || workerId,
      date: dateText(),
      type,
      title,
      message,
      gps,
      status: "pending",
      adminComment: "",
      createdAt: now(),
      updatedAt: now(),
      approvedBy: "",
      approvedAt: 0
    };

    const result = await postJson(`companies/${companyCode}/errors/${ym()}`, error);
    if(result && result.name){
      await patchJson(`companies/${companyCode}/errors/${ym()}/${result.name}`, {
        errorId: result.name
      });
    }
  }

  async function checkLocationDifference(gps){
    const enabled = await getJson(`companies/${companyCode}/settings/locationCheck/enabled`);
    if(enabled === false) return false;

    const threshold = Number(await getJson(`companies/${companyCode}/settings/locationCheck/distanceThresholdMeters`) || 300);

    let base = null;

    if(worker.usualLocation && worker.usualLocation.lat && worker.usualLocation.lng){
      base = worker.usualLocation;
    }else if(worker.lastClockGps && worker.lastClockGps.lat && worker.lastClockGps.lng){
      base = worker.lastClockGps;
    }

    if(!base) return false;

    const dist = getDistanceMeters(Number(base.lat),Number(base.lng),Number(gps.lat),Number(gps.lng));

    if(dist > threshold){
      await createError(
        "location_difference",
        "場所違い",
        `通常または前回の打刻場所から約${Math.round(dist)}m離れています。`,
        gps
      );
      return true;
    }

    return false;
  }

  async function checkLate(inTime){
    const cal = await getJson(`companies/${companyCode}/calendar/${ym()}/${ymd()}`);
    if(!cal || cal.dayType !== "workday") return;

    if(worker.workStart && inTime > worker.workStart){
      await createError(
        "late",
        "遅刻候補",
        `開始時刻 ${worker.workStart} より出勤打刻 ${inTime} が遅い可能性があります。`,
        null
      );
    }
  }

  async function checkEarlyLeave(outTime){
    const cal = await getJson(`companies/${companyCode}/calendar/${ym()}/${ymd()}`);
    if(!cal || cal.dayType !== "workday") return;

    if(worker.workEnd && outTime < worker.workEnd){
      await createError(
        "early_leave",
        "早退候補",
        `終了時刻 ${worker.workEnd} より退勤打刻 ${outTime} が早い可能性があります。`,
        null
      );
    }
  }

  function calcBreakMinutes(inTime,outTime){
    if(!inTime || !outTime) return 0;
    const [ih,im]=inTime.split(":").map(Number);
    const [oh,om]=outTime.split(":").map(Number);
    const minutes=(oh*60+om)-(ih*60+im);
    if(minutes > 480) return 60;
    if(minutes > 360) return 45;
    return 0;
  }

  function calcWorkMinutes(inTime,outTime,breakMinutes){
    if(!inTime || !outTime) return 0;
    const [ih,im]=inTime.split(":").map(Number);
    const [oh,om]=outTime.split(":").map(Number);
    return Math.max(0,(oh*60+om)-(ih*60+im)-breakMinutes);
  }

  async function clockIn(){
    const btn=$("clockInBtn");

    try{
      disableButton(btn,true,"処理中...");
      setMsg("clockMsg","処理中...");

      await loadToday();

      if(todayAttendance && todayAttendance.inTime){
        await createError("double_in","二重出勤","すでに出勤打刻があります。",null);
        throw new Error("すでに出勤打刻があります。");
      }

      const gps = await getPosition();
      const inTime = timeText();
      const locationDifferent = await checkLocationDifference(gps);

      const data = {
        date: dateText(),
        workerId,
        workerCode: worker.code || workerId,
        workerName: worker.name || workerId,
        inTime,
        outTime: todayAttendance?.outTime || "",
        inGps: gps,
        outGps: todayAttendance?.outGps || null,
        breakMinutes: todayAttendance?.breakMinutes || 0,
        workMinutes: todayAttendance?.workMinutes || 0,
        earlyWorkMinutes: todayAttendance?.earlyWorkMinutes || 0,
        overtimeMinutes: todayAttendance?.overtimeMinutes || 0,
        holidayWorkMinutes: todayAttendance?.holidayWorkMinutes || 0,
        late: false,
        earlyLeave: false,
        absence: false,
        locationApproval: locationDifferent ? "pending" : "none",
        approvalStatus: "none",
        note: todayAttendance?.note || "",
        createdAt: todayAttendance?.createdAt || now(),
        updatedAt: now()
      };

      await putJson(`companies/${companyCode}/attendance/${ym()}/${workerId}/${ymd()}`, data);

      await patchJson(`companies/${companyCode}/workers/${workerId}`, {
        lastClockGps: {
          lat: gps.lat,
          lng: gps.lng,
          updatedAt: now()
        },
        updatedAt: now()
      });

      await checkLate(inTime);

      setMsg("clockMsg","出勤しました。");
      await loadToday();
      await loadErrors();

    }catch(e){
      setMsg("clockMsg",e.message || "出勤できませんでした。",true);
    }finally{
      disableButton(btn,false,"出勤");
    }
  }

  async function clockOut(){
    const btn=$("clockOutBtn");

    try{
      disableButton(btn,true,"処理中...");
      setMsg("clockMsg","処理中...");

      await loadToday();

      if(!todayAttendance || !todayAttendance.inTime){
        await createError("out_without_in","出勤なし退勤","出勤打刻がない状態で退勤しようとしました。",null);
        throw new Error("出勤打刻がありません。");
      }

      if(todayAttendance.outTime){
        throw new Error("すでに退勤打刻があります。");
      }

      const gps = await getPosition();
      const outTime = timeText();
      const locationDifferent = await checkLocationDifference(gps);

      const breakMinutes = calcBreakMinutes(todayAttendance.inTime,outTime);
      const workMinutes = calcWorkMinutes(todayAttendance.inTime,outTime,breakMinutes);

      await patchJson(`companies/${companyCode}/attendance/${ym()}/${workerId}/${ymd()}`, {
        outTime,
        outGps: gps,
        breakMinutes,
        workMinutes,
        locationApproval: locationDifferent ? "pending" : (todayAttendance.locationApproval || "none"),
        updatedAt: now()
      });

      await patchJson(`companies/${companyCode}/workers/${workerId}`, {
        lastClockGps: {
          lat: gps.lat,
          lng: gps.lng,
          updatedAt: now()
        },
        updatedAt: now()
      });

      await checkEarlyLeave(outTime);

      setMsg("clockMsg","退勤しました。");
      await loadToday();
      await loadErrors();

    }catch(e){
      setMsg("clockMsg",e.message || "退勤できませんでした。",true);
    }finally{
      disableButton(btn,false,"退勤");
    }
  }

  async function sendRequest(){
    const btn=$("sendRequestBtn");

    const type=$("requestType").value;
    const date=$("requestDate").value;
    const startTime=$("requestStart").value;
    const endTime=$("requestEnd").value;
    const reason=$("requestReason").value.trim();

    if(!date || !startTime || !endTime || !reason){
      setMsg("requestMsg","日付、開始時刻、終了時刻、理由を入力してください。",true);
      return;
    }

    try{
      disableButton(btn,true,"処理中...");

      const targetYm = date.replaceAll("-","").slice(0,6);

      const req = {
        workerId,
        workerCode: worker.code || workerId,
        workerName: worker.name || workerId,
        type,
        date,
        startTime,
        endTime,
        reason,
        status: "pending",
        adminComment: "",
        createdAt: now(),
        updatedAt: now(),
        approvedBy: "",
        approvedAt: 0
      };

      const result = await postJson(`companies/${companyCode}/requests/${targetYm}`, req);

      if(result && result.name){
        await patchJson(`companies/${companyCode}/requests/${targetYm}/${result.name}`, {
          requestId: result.name
        });
      }

      $("requestReason").value="";
      setMsg("requestMsg","申請しました。");

    }catch(e){
      setMsg("requestMsg",e.message || "申請できませんでした。",true);
    }finally{
      disableButton(btn,false,"申請する");
    }
  }

  async function loadErrors(){
    const data = await getJson(`companies/${companyCode}/errors/${ym()}`);

    if(!data){
      $("errorList").textContent="現在、表示する打刻エラーはありません。";
      return;
    }

    const list = Object.values(data)
      .filter(e => e && e.workerId === workerId)
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    if(list.length === 0){
      $("errorList").textContent="現在、表示する打刻エラーはありません。";
      return;
    }

    let html = `<table><thead><tr><th>日付</th><th>内容</th><th>状態</th></tr></thead><tbody>`;

    for(const e of list){
      const status =
        e.status === "approved" ? "承認済み" :
        e.status === "rejected" ? "否決" : "確認待ち";

      html += `
        <tr>
          <td>${e.date || ""}</td>
          <td><b>${e.title || e.type}</b><br>${e.message || ""}</td>
          <td>${status}</td>
        </tr>
      `;
    }

    html += `</tbody></table>`;
    $("errorList").innerHTML=html;
  }

  function startHold(e){
    e.preventDefault();
    if($("clockOutBtn").disabled) return;

    holdDone=false;
    $("clockOutBtn").textContent="そのまま長押し...";
    holdTimer=setTimeout(()=>{
      holdDone=true;
      clockOut();
    },1200);
  }

  function cancelHold(){
    if(holdTimer) clearTimeout(holdTimer);
    holdTimer=null;

    if(!holdDone && !$("clockOutBtn").disabled){
      $("clockOutBtn").textContent="退勤";
    }
  }

  $("clockInBtn").addEventListener("click", clockIn);

  $("clockOutBtn").addEventListener("mousedown", startHold);
  $("clockOutBtn").addEventListener("touchstart", startHold, {passive:false});
  $("clockOutBtn").addEventListener("mouseup", cancelHold);
  $("clockOutBtn").addEventListener("mouseleave", cancelHold);
  $("clockOutBtn").addEventListener("touchend", cancelHold);
  $("clockOutBtn").addEventListener("touchcancel", cancelHold);

  $("sendRequestBtn").addEventListener("click", sendRequest);

  $("logoutBtn").addEventListener("click", ()=>{
    localStorage.removeItem("smartKintaiWorkerLogin");
    location.href="index.html";
  });

  async function init(){
    try{
      await loadLogin();
      await loadToday();
      await loadErrors();
    }catch(e){
      alert(e.message || "読み込みに失敗しました。");
    }
  }

  init();
</script>
</body>
</html>
