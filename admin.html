<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面｜スマート勤怠</title>
<style>
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:14px;
  color:#111827;
}
.wrap{max-width:1500px;margin:0 auto}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
h1{font-size:24px;margin:0 0 10px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:14px 0 8px}
label{display:block;font-weight:700;margin-top:10px}
input,select,textarea{
  width:100%;
  box-sizing:border-box;
  padding:10px;
  font-size:15px;
  border:1px solid #d1d5db;
  border-radius:10px;
  margin-top:5px;
}
textarea{min-height:70px}
button{
  padding:10px 12px;
  font-size:14px;
  font-weight:800;
  border:0;
  border-radius:10px;
  margin:4px;
  cursor:pointer;
}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
.red{background:#dc2626;color:#fff}
.gray{background:#e5e7eb;color:#111827}
.dark{background:#111827;color:#fff}
.orange{background:#f97316;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.col{flex:1;min-width:180px}
.msg{font-weight:800;white-space:pre-wrap;margin-top:8px}
.ok{color:#166534}
.ng{color:#dc2626}
.small{font-size:13px;color:#6b7280;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{border:1px solid #e5e7eb;padding:7px;text-align:left;vertical-align:top}
th{background:#f9fafb}
.tabs button{background:#e5e7eb;color:#111827}
.tabs button.active{background:#2563eb;color:#fff}
.hidden{display:none}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}
.b-pending{background:#fef3c7;color:#92400e}
.b-approved{background:#dcfce7;color:#166534}
.b-rejected{background:#fee2e2;color:#991b1b}
.b-none{background:#e5e7eb;color:#374151}
.printArea{background:#fff;padding:16px}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .noPrint{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">

<div class="noPrint">
  <h1>管理画面</h1>

  <div class="card">
    <h2>管理者情報</h2>
    <div id="adminInfo" class="small">確認中...</div>
    <div id="loginCheckMsg" class="msg"></div>
    <button class="gray" id="backBtn">ログイン画面へ</button>
    <button class="red" id="logoutBtn">ログアウト</button>
  </div>

  <div class="card tabs">
    <button data-tab="workers" class="active">従業員</button>
    <button data-tab="company">会社設定</button>
    <button data-tab="calendar">会社カレンダー</button>
    <button data-tab="attendance">勤怠確認</button>
    <button data-tab="requests">申請</button>
    <button data-tab="errors">打刻エラー</button>
    <button data-tab="close">締めCSV</button>
    <button data-tab="logs">履歴</button>
  </div>
</div>

<section id="tab-workers" class="card">
<h2>従業員管理</h2>

<div class="row">
  <div class="col">
    <label>社員コード</label>
    <input id="wCode" placeholder="例：岸澤 / 001 / A001 / 車両番号">
  </div>
  <div class="col">
    <label>氏名</label>
    <input id="wName" placeholder="氏名">
  </div>
  <div class="col">
    <label>個別パスワード</label>
    <input id="wPass" placeholder="例：1234">
  </div>
  <div class="col">
    <label>雇用区分</label>
    <select id="wType">
      <option>正社員</option>
      <option>パート</option>
      <option>アルバイト</option>
    </select>
  </div>
  <div class="col">
    <label>開始時刻</label>
    <input id="wStart" type="time" value="08:00">
  </div>
  <div class="col">
    <label>終了時刻</label>
    <input id="wEnd" type="time" value="17:00">
  </div>
</div>

<button class="primary" id="saveWorkerBtn">従業員を保存</button>
<button class="gray" id="clearWorkerBtn">入力欄をクリア</button>
<div id="workerMsg" class="msg"></div>
<div id="workerList"></div>
</section>

<section id="tab-company" class="card hidden">
<h2>会社設定</h2>

<div class="row">
  <div class="col">
    <label>会社名</label>
    <input id="companyNameInput" placeholder="会社名">
  </div>
  <div class="col">
    <label>締め日</label>
    <select id="closingDayInput">
      <option value="末日">末日</option>
      <option value="1">1日</option><option value="2">2日</option><option value="3">3日</option>
      <option value="4">4日</option><option value="5">5日</option><option value="6">6日</option>
      <option value="7">7日</option><option value="8">8日</option><option value="9">9日</option>
      <option value="10">10日</option><option value="11">11日</option><option value="12">12日</option>
      <option value="13">13日</option><option value="14">14日</option><option value="15">15日</option>
      <option value="16">16日</option><option value="17">17日</option><option value="18">18日</option>
      <option value="19">19日</option><option value="20">20日</option><option value="21">21日</option>
      <option value="22">22日</option><option value="23">23日</option><option value="24">24日</option>
      <option value="25">25日</option><option value="26">26日</option><option value="27">27日</option>
      <option value="28">28日</option><option value="29">29日</option><option value="30">30日</option>
      <option value="31">31日</option>
    </select>
  </div>
  <div class="col">
    <label>場所違い判定距離（m）</label>
    <input id="distanceInput" type="number" value="300">
  </div>
</div>

<button class="primary" id="saveCompanyBtn">会社設定を保存</button>
<div id="companyMsg" class="msg"></div>
</section>

<section id="tab-calendar" class="card hidden">
<h2>会社カレンダー</h2>

<div class="row">
  <div class="col">
    <label>対象月</label>
    <input id="calMonth" type="month">
  </div>
  <div class="col">
    <button class="primary" id="makeWeekdayBtn">平日を出勤日・土日を休日</button>
  </div>
  <div class="col">
    <button class="green" id="makeAllWorkBtn">全日出勤日</button>
  </div>
  <div class="col">
    <button class="gray" id="makeAllHolidayBtn">全日休日</button>
  </div>
</div>

<div id="calendarMsg" class="msg"></div>
<div id="calendarList"></div>
</section>

<section id="tab-attendance" class="card hidden">
<h2>勤怠確認・手動編集</h2>

<div class="row">
  <div class="col">
    <label>対象月</label>
    <input id="attMonth" type="month">
  </div>
  <div class="col">
    <label>従業員絞り込み</label>
    <select id="attWorkerFilter">
      <option value="">全員</option>
    </select>
  </div>
  <div class="col">
    <button class="primary" id="loadAttendanceBtn">読み込み</button>
  </div>
  <div class="col">
    <button class="orange" id="detectErrorsBtn">未退勤・欠勤などを検知</button>
  </div>
</div>

<div id="attendanceMsg" class="msg"></div>
<div id="attendanceList"></div>
</section>

<section id="tab-requests" class="card hidden">
<h2>申請一覧</h2>

<div class="row">
  <div class="col">
    <label>対象月</label>
    <input id="reqMonth" type="month">
  </div>
  <div class="col">
    <label>状態</label>
    <select id="requestStatusFilter">
      <option value="">全て</option>
      <option value="pending">確認待ち</option>
      <option value="approved">承認済み</option>
      <option value="rejected">否決</option>
    </select>
  </div>
  <div class="col">
    <button class="primary" id="loadRequestsBtn">読み込み</button>
  </div>
</div>

<div id="requestList"></div>
</section>

<section id="tab-errors" class="card hidden">
<h2>打刻エラー一覧</h2>

<div class="row">
  <div class="col">
    <label>対象月</label>
    <input id="errMonth" type="month">
  </div>
  <div class="col">
    <label>状態</label>
    <select id="errorStatusFilter">
      <option value="">全て</option>
      <option value="pending">確認待ち</option>
      <option value="approved">承認済み</option>
      <option value="rejected">否決</option>
    </select>
  </div>
  <div class="col">
    <button class="primary" id="loadErrorsBtn">読み込み</button>
  </div>
</div>

<div id="errorList"></div>
</section>

<section id="tab-close" class="card hidden">
<h2>締めてCSV出力</h2>

<div class="row">
  <div class="col">
    <label>対象月</label>
    <input id="closeMonth" type="month">
  </div>
  <div class="col">
    <label>期間開始</label>
    <input id="periodStart" type="date">
  </div>
  <div class="col">
    <label>期間終了</label>
    <input id="periodEnd" type="date">
  </div>
</div>

<button class="red" id="closeBtn">締めてCSV出力</button>
<button class="gray" id="printBtn">印刷用明細を印刷 / PDF保存</button>

<div class="small">
この期間の勤怠を締めてCSVを出力します。CSV出力後、この期間の勤怠データは削除されます。CSVファイルと印刷用明細は必ず保管してください。
</div>

<div id="closeMsg" class="msg"></div>
</section>

<section id="tab-logs" class="card hidden">
<h2>履歴</h2>

<div class="row">
  <div class="col">
    <button class="primary" id="loadLogsBtn">履歴を読み込み</button>
  </div>
</div>

<div id="logsList"></div>
</section>

<section id="printArea" class="printArea hidden"></section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyAokZ3FYeL3qjmZOHhVznhwykvyQu8axp8",
  authDomain:"smart-kintai.firebaseapp.com",
  databaseURL:"https://smart-kintai-default-rtdb.firebaseio.com",
  projectId:"smart-kintai",
  storageBucket:"smart-kintai.firebasestorage.app",
  messagingSenderId:"46581025027",
  appId:"1:46581025027:web:80ca643edc2c202d9f4136",
  measurementId:"G-NY70722CRJ"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const DB_URL=firebaseConfig.databaseURL;
const $=id=>document.getElementById(id);

let companyCode="";
let currentUser=null;
let workers={};
let companyInfo={};
let latestRows=[];

function sanitizeKey(v){return String(v||"").trim().replace(/[.#$/\[\]]/g,"_")}
function pad(n){return String(n).padStart(2,"0")}
function now(){return Date.now()}
function ymFromMonth(v){return String(v||"").replace("-","")}
function todayMonth(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function todayKey(){const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`}
function keyFromDateText(d){return String(d||"").replaceAll("-","")}
function ymdTextFromKey(k){return `${k.slice(0,4)}-${k.slice(4,6)}-${k.slice(6,8)}`}
function minutesText(min){min=Number(min||0);return `${Math.floor(min/60)}:${pad(min%60)}`}
function setMsg(id,text,isError=false){const el=$(id);el.textContent=text;el.className="msg "+(isError?"ng":"ok")}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

async function getJson(path){
  const res=await fetch(`${DB_URL}/${path}.json`);
  if(!res.ok) throw new Error(`読み込みに失敗しました: ${res.status}`);
  return await res.json();
}
async function putJson(path,data){
  const res=await fetch(`${DB_URL}/${path}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!res.ok) throw new Error(`保存に失敗しました: ${res.status}`);
  return await res.json();
}
async function patchJson(path,data){
  const res=await fetch(`${DB_URL}/${path}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!res.ok) throw new Error(`保存に失敗しました: ${res.status}`);
  return await res.json();
}
async function deleteJson(path){
  const res=await fetch(`${DB_URL}/${path}.json`,{method:"DELETE"});
  if(!res.ok) throw new Error(`削除に失敗しました: ${res.status}`);
  return await res.json();
}
async function postJson(path,data){
  const res=await fetch(`${DB_URL}/${path}.json`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!res.ok) throw new Error(`保存に失敗しました: ${res.status}`);
  return await res.json();
}

function getQueryCompany(){
  const p=new URLSearchParams(location.search);
  return sanitizeKey(p.get("company")) || sanitizeKey(localStorage.getItem("smartKintaiAdminCompanyCode")) || "demo";
}

function switchTab(tab){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.tabs button[data-tab="${tab}"]`).classList.add("active");
  ["workers","company","calendar","attendance","requests","errors","close","logs"].forEach(t=>{
    $(`tab-${t}`).classList.toggle("hidden",t!==tab);
  });
}

function statusText(s){
  return s==="approved"?"承認済み":s==="rejected"?"否決":"確認待ち";
}
function statusBadge(s){
  const cls=s==="approved"?"b-approved":s==="rejected"?"b-rejected":s==="pending"?"b-pending":"b-none";
  return `<span class="badge ${cls}">${statusText(s)}</span>`;
}
function requestTypeText(t){
  return {early_work:"早出申請",overtime:"残業申請",holiday_work:"休日出勤申請",clock_fix:"打刻修正申請"}[t]||t;
}
function errorTypeText(t){
  return {
    out_without_in:"出勤なし退勤",
    missing_out_next_day:"退勤なし翌日",
    double_in:"二重出勤",
    long_working:"長時間未退勤",
    location_difference:"場所違い",
    late:"遅刻候補",
    early_leave:"早退候補",
    absence:"欠勤候補"
  }[t]||t;
}

async function requireAdmin(){
  companyCode=getQueryCompany();
  setMsg("loginCheckMsg","管理者ログイン状態を確認中...");

  onAuthStateChanged(auth,async user=>{
    if(!user){
      setMsg("loginCheckMsg","管理者ログインが必要です。",true);
      alert("管理者ログインが必要です。");
      location.href="index.html";
      return;
    }

    currentUser=user;

    try{
      const allowed=await getJson(`companies/${companyCode}/admins/${user.uid}`);

      if(allowed!==true){
        setMsg("loginCheckMsg",`この会社の管理者として登録されていません。\n会社コード：${companyCode}\nUID：${user.uid}`,true);
        alert("この会社の管理者として登録されていません。");
        await signOut(auth);
        location.href="index.html";
        return;
      }

      localStorage.setItem("smartKintaiAdminCompanyCode",companyCode);
      companyInfo=await getJson(`companies/${companyCode}/companyInfo`) || {};

      $("adminInfo").innerHTML=`
        会社コード：${escapeHtml(companyCode)}<br>
        会社名：${escapeHtml(companyInfo.companyName||"")}<br>
        管理者：${escapeHtml(user.email||user.uid)}<br>
        UID：${escapeHtml(user.uid)}
      `;
      setMsg("loginCheckMsg","管理者確認OK。");

      await loadCompanySettings();
      await loadWorkers();

    }catch(e){
      setMsg("loginCheckMsg",`管理者確認に失敗しました。\n${e.message}\n会社コード・UID・Rulesを確認してください。`,true);
    }
  });
}

async function loadCompanySettings(){
  companyInfo=await getJson(`companies/${companyCode}/companyInfo`) || {};
  const distance=await getJson(`companies/${companyCode}/settings/locationCheck/distanceThresholdMeters`);

  $("companyNameInput").value=companyInfo.companyName||"";
  $("closingDayInput").value=companyInfo.closingDay||"末日";
  $("distanceInput").value=distance||300;
}

async function saveCompanySettings(){
  try{
    const companyName=$("companyNameInput").value.trim();
    const closingDay=$("closingDayInput").value;
    const distance=Number($("distanceInput").value||300);

    await patchJson(`companies/${companyCode}/companyInfo`,{
      companyCode,
      companyName,
      closingDay,
      active:true,
      updatedAt:now()
    });

    await patchJson(`companies/${companyCode}/settings/locationCheck`,{
      enabled:true,
      distanceThresholdMeters:distance
    });

    companyInfo=await getJson(`companies/${companyCode}/companyInfo`) || {};
    setMsg("companyMsg","会社設定を保存しました。");
  }catch(e){
    setMsg("companyMsg",e.message,true);
  }
}

async function loadWorkers(){
  workers=await getJson(`companies/${companyCode}/workers`) || {};
  renderWorkers();
  refreshWorkerFilters();
}

function refreshWorkerFilters(){
  const sel=$("attWorkerFilter");
  const current=sel.value;
  sel.innerHTML=`<option value="">全員</option>`;
  Object.entries(workers||{}).forEach(([id,w])=>{
    const opt=document.createElement("option");
    opt.value=id;
    opt.textContent=`${w.name||id}（${w.code||id}）`;
    sel.appendChild(opt);
  });
  sel.value=current;
}

function renderWorkers(){
  const entries=Object.entries(workers||{});
  if(entries.length===0){
    $("workerList").innerHTML=`<p class="small">従業員が登録されていません。</p>`;
    return;
  }

  let html=`<table><thead><tr>
  <th>社員コード</th><th>氏名</th><th>個別パスワード</th><th>区分</th><th>勤務時間</th><th>通常場所</th><th>前回場所</th><th>状態</th><th>操作</th>
  </tr></thead><tbody>`;

  for(const [id,w] of entries){
    const usual=w.usualLocation&&w.usualLocation.lat?`<a target="_blank" href="https://www.google.com/maps?q=${w.usualLocation.lat},${w.usualLocation.lng}">確認</a>`:"未設定";
    const last=w.lastClockGps&&w.lastClockGps.lat?`<a target="_blank" href="https://www.google.com/maps?q=${w.lastClockGps.lat},${w.lastClockGps.lng}">確認</a>`:"なし";
    html+=`<tr>
      <td>${escapeHtml(w.code||id)}</td>
      <td>${escapeHtml(w.name||"")}</td>
      <td>${escapeHtml(w.loginPasscode||"")}</td>
      <td>${escapeHtml(w.employmentType||"")}</td>
      <td>${escapeHtml(w.workStart||"")}〜${escapeHtml(w.workEnd||"")}</td>
      <td>${usual}</td>
      <td>${last}</td>
      <td>${w.active===false?"停止":"有効"}</td>
      <td>
        <button class="gray" onclick="editWorker('${id}')">編集</button>
        <button class="${w.active===false?"green":"red"}" onclick="toggleWorker('${id}')">${w.active===false?"有効化":"停止"}</button>
        <button class="orange" onclick="setUsualFromLast('${id}')">前回場所を通常場所にする</button>
      </td>
    </tr>`;
  }

  html+=`</tbody></table>`;
  $("workerList").innerHTML=html;
}

window.editWorker=function(id){
  const w=workers[id];
  $("wCode").value=w.code||id;
  $("wName").value=w.name||"";
  $("wPass").value=w.loginPasscode||"";
  $("wType").value=w.employmentType||"正社員";
  $("wStart").value=w.workStart||"08:00";
  $("wEnd").value=w.workEnd||"17:00";
  window.scrollTo({top:0,behavior:"smooth"});
};

window.toggleWorker=async function(id){
  const w=workers[id];
  await patchJson(`companies/${companyCode}/workers/${id}`,{
    active:w.active===false?true:false,
    updatedAt:now()
  });
  await loadWorkers();
};

window.setUsualFromLast=async function(id){
  const w=workers[id];
  if(!w.lastClockGps||!w.lastClockGps.lat){
    alert("前回打刻場所がありません。");
    return;
  }
  await patchJson(`companies/${companyCode}/workers/${id}`,{
    usualLocation:{
      lat:w.lastClockGps.lat,
      lng:w.lastClockGps.lng,
      updatedAt:now()
    },
    updatedAt:now()
  });
  await loadWorkers();
};

async function saveWorker(){
  const code=sanitizeKey($("wCode").value);
  const name=$("wName").value.trim();
  const pass=$("wPass").value.trim();

  if(!code||!name||!pass){
    setMsg("workerMsg","社員コード、氏名、個別パスワードを入力してください。",true);
    return;
  }

  try{
    const existing=await getJson(`companies/${companyCode}/workers/${code}`);

    const data={
      code,
      name,
      loginPasscode:pass,
      employmentType:$("wType").value,
      active:true,
      workStart:$("wStart").value||"08:00",
      workEnd:$("wEnd").value||"17:00",
      usualLocation:existing?.usualLocation || {lat:null,lng:null,updatedAt:0},
      lastClockGps:existing?.lastClockGps || {lat:null,lng:null,updatedAt:0},
      createdAt:existing?.createdAt || now(),
      updatedAt:now()
    };

    await putJson(`companies/${companyCode}/workers/${code}`,data);

    $("wCode").value="";
    $("wName").value="";
    $("wPass").value="";
    setMsg("workerMsg","従業員を保存しました。");
    await loadWorkers();
  }catch(e){

function daysInMonth(monthValue){
  const [y,m]=monthValue.split("-").map(Number);
  return new Date(y,m,0).getDate();
}
function dateKey(monthValue,day){
  const [y,m]=monthValue.split("-");
  return `${y}${m}${pad(day)}`;
}
function dateIso(monthValue,day){
  return `${monthValue}-${pad(day)}`;
}

async function makeCalendar(mode){
  const month=$("calMonth").value;
  if(!month){
    setMsg("calendarMsg","対象月を選んでください。",true);
    return;
  }

  try{
    const total=daysInMonth(month);
    const yyyyMM=ymFromMonth(month);
    const updates={};

    for(let d=1;d<=total;d++){
      const key=dateKey(month,d);
      const iso=dateIso(month,d);
      const day=new Date(iso).getDay();
      let dayType="workday";

      if(mode==="weekday") dayType=(day===0||day===6)?"holiday":"workday";
      if(mode==="allWork") dayType="workday";
      if(mode==="allHoliday") dayType="holiday";

      updates[key]={date:iso,dayType,note:"",updatedAt:now(),updatedBy:currentUser.uid};
    }

    await putJson(`companies/${companyCode}/calendar/${yyyyMM}`,updates);
    setMsg("calendarMsg","会社カレンダーを作成しました。");
    await loadCalendar();
  }catch(e){
    setMsg("calendarMsg",e.message,true);
  }
}

function calcWorkMinutes(inTime,outTime,breakMinutes){
  if(!inTime||!outTime) return 0;
  const [ih,im]=inTime.split(":").map(Number);
  const [oh,om]=outTime.split(":").map(Number);
  return Math.max(0,(oh*60+om)-(ih*60+im)-Number(breakMinutes||0));
}

function calcBreakMinutesByRule(inTime,outTime){
  if(!inTime||!outTime) return 0;
  const [ih,im]=inTime.split(":").map(Number);
  const [oh,om]=outTime.split(":").map(Number);
  const total=(oh*60+om)-(ih*60+im);
  if(total>480) return 60;
  if(total>360) return 45;
  return 0;
}

async function detectAttendanceErrors(){
  try{
    const month=$("attMonth").value;
    const yyyyMM=ymFromMonth(month);
    if(!yyyyMM){
      setMsg("attendanceMsg","対象月を選んでください。",true);
      return;
    }

    const calendar=await getJson(`companies/${companyCode}/calendar/${yyyyMM}`) || {};
    const attendance=await getJson(`companies/${companyCode}/attendance/${yyyyMM}`) || {};
    const existingErrors=await getJson(`companies/${companyCode}/errors/${yyyyMM}`) || {};
    const existingKeys=new Set(Object.values(existingErrors).map(e=>`${e.type}_${e.workerId}_${keyFromDateText(e.date||"")}`));

    let created=0;
    const today=todayKey();

    for(const [dateKey,cal] of Object.entries(calendar)){
      if(dateKey>today) continue;

      for(const [workerId,w] of Object.entries(workers||{})){
        if(w.active===false) continue;
        const row=attendance?.[workerId]?.[dateKey] || null;

        if(cal.dayType==="workday"){
          if(!row || !row.inTime){
            const unique=`absence_${workerId}_${dateKey}`;
            if(!existingKeys.has(unique)){
              await createError(yyyyMM,{
                workerId,
                workerCode:w.code||workerId,
                workerName:w.name||workerId,
                date:cal.date||ymdTextFromKey(dateKey),
                type:"absence",
                title:"欠勤候補",
                message:"出勤日に出勤打刻がありません。",
                gps:null,
                status:"pending",
                adminComment:"",
                createdAt:now(),
                updatedAt:now(),
                approvedBy:"",
                approvedAt:0
              });
              created++;
            }
          }

          if(row&&row.inTime&&!row.outTime&&dateKey<today){
            const unique=`missing_out_next_day_${workerId}_${dateKey}`;
            if(!existingKeys.has(unique)){
              await createError(yyyyMM,{
                workerId,
                workerCode:w.code||workerId,
                workerName:w.name||workerId,
                date:row.date||ymdTextFromKey(dateKey),
                type:"missing_out_next_day",
                title:"退勤なし翌日",

                gps:null,
                status:"pending",
                adminComment:"",
                createdAt:now(),
                updatedAt:now(),
                approvedBy:"",
                approvedAt:0
              });
              created++;
            }
          }
        }

        if(row&&row.inTime&&!row.outTime&&dateKey===today){
          const [ih,im]=row.inTime.split(":").map(Number);
          const startMin=ih*60+im;
          const d=new Date();
          const nowMin=d.getHours()*60+d.getMinutes();
          if(nowMin-startMin>12*60){
            const unique=`long_working_${workerId}_${dateKey}`;
            if(!existingKeys.has(unique)){
              await createError(yyyyMM,{
                workerId,
                workerCode:w.code||workerId,
                workerName:w.name||workerId,
                date:row.date||ymdTextFromKey(dateKey),
                type:"long_working",

                message:"出勤から12時間以上経過していますが、退勤打刻がありません。",
                gps:null,
                status:"pending",
                adminComment:"",
                createdAt:now(),
                updatedAt:now(),
                approvedBy:"",
                approvedAt:0
              });
              created++;
            }
          }
        }
      }
    }

    setMsg("attendanceMsg",`検知完了：${created}件のエラー候補を作成しました。`);
  }catch(e){
    setMsg("attendanceMsg",e.message,true);
  }
}

function csvEscape(v){
  const s=String(v??"");
  return `"${s.replaceAll('"','""')}"`;
}
function downloadCsv(filename,rows){
  const csv=rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  a.click();
  URL.revokeObjectURL(url);
}
function countNestedAttendance(att){
  let count=0;
  for(const days of Object.values(att||{})) count+=Object.keys(days||{}).length;
  return count;
}
function sumReqMinutes(reqs,type){
  return reqs.filter(r=>r.type===type).reduce((sum,r)=>sum+requestMinutes(r),0);
}
function withinPeriod(dateText,start,end){
  if(!dateText) return false;
  return dateText>=start && dateText<=end;
}

async function buildCloseRows(yyyyMM){
  const attendance=await getJson(`companies/${companyCode}/attendance/${yyyyMM}`) || {};
  const requests=await getJson(`companies/${companyCode}/requests/${yyyyMM}`) || {};
  const approvedRequests=Object.values(requests||{}).filter(r=>r.status==="approved");

  const start=$("periodStart").value;
  const end=$("periodEnd").value;
  const header=["会社名","対象期間","社員コード","氏名","日付","出勤","退勤","出勤GPS","退勤GPS","休憩","実働","早出","残業","休日出勤","遅刻","早退","欠勤","承認状況","備考"];
  const period=`${start}〜${end}`;
  const rows=[header];
  latestRows=[];

  for(const [workerId,days] of Object.entries(attendance)){
    for(const [dateKey,row] of Object.entries(days||{})){
      const date=row.date||ymdTextFromKey(dateKey);
      if(!withinPeriod(date,start,end)) continue;

      const dayReqs=approvedRequests.filter(r=>r.workerId===workerId && keyFromDateText(r.date)===dateKey);
      const early=Number(row.earlyWorkMinutes||0)+sumReqMinutes(dayReqs,"early_work");
      const overtime=Number(row.overtimeMinutes||0)+sumReqMinutes(dayReqs,"overtime");
      const holiday=Number(row.holidayWorkMinutes||0)+sumReqMinutes(dayReqs,"holiday_work");

      rows.push([
        companyInfo.companyName||companyCode,
        period,
        row.workerCode||workerId,
        row.workerName||"",
        date,
        row.inTime||"",
        row.outTime||"",
        row.inGps?`${row.inGps.lat},${row.inGps.lng}`:"",
        row.outGps?`${row.outGps.lat},${row.outGps.lng}`:"",
        row.breakMinutes||0,
        row.workMinutes||0,
        early,
        overtime,
        holiday,
        row.late?"あり":"",
        row.earlyLeave?"あり":"",
        row.absence?"あり":"",
        row.approvalStatus||row.locationApproval||"",
        row.note||""
      ]);

      latestRows.push({workerId,dateKey,row,early,overtime,holiday});
    }
  }

  return rows;
}

        <td>${r.earlyLeave?"あり":""}</td>
        <td>${r.absence?"あり":""}</td>
        <td>${escapeHtml(r.note||"")}</td>
      </tr>`;
    }

    html+=`</tbody></table>
      <h3>月合計</h3>
      <p>
        出勤日数：${workDays}<br>
        欠勤日数：${absence}<br>
        実働合計：${minutesText(totalWork)}<br>
        休憩合計：${minutesText(totalBreak)}<br>
        承認済み残業合計：${minutesText(totalOver)}<br>
        休日出勤合計：${minutesText(totalHoliday)}<br>
        遅刻回数：${lateCount}<br>
        早退回数：${earlyLeaveCount}
      </p>
    </div>`;
  }

  $("printArea").innerHTML=html || "<p>印刷対象データがありません。</p>";
  $("printArea").classList.remove("hidden");
}

async function deletePeriodData(yyyyMM,start,end){
  const attendance=await getJson(`companies/${companyCode}/attendance/${yyyyMM}`) || {};
  const requests=await getJson(`companies/${companyCode}/requests/${yyyyMM}`) || {};
  const errors=await getJson(`companies/${companyCode}/errors/${yyyyMM}`) || {};

  let deletedAttendanceCount=0,deletedRequestCount=0,deletedErrorCount=0;

  for(const [workerId,days] of Object.entries(attendance)){
    for(const [dateKey,row] of Object.entries(days||{})){
      const date=row.date||ymdTextFromKey(dateKey);
      if(withinPeriod(date,start,end)){
        await deleteJson(`companies/${companyCode}/attendance/${yyyyMM}/${workerId}/${dateKey}`);
        deletedAttendanceCount++;
      }
    }
  }

  for(const [id,r] of Object.entries(requests)){
    if(withinPeriod(r.date,start,end)){
      await deleteJson(`companies/${companyCode}/requests/${yyyyMM}/${id}`);
      deletedRequestCount++;
    }
  }

  for(const [id,e] of Object.entries(errors)){
    if(withinPeriod(e.date,start,end)){
      await deleteJson(`companies/${companyCode}/errors/${yyyyMM}/${id}`);
      deletedErrorCount++;
    }
  }

  return {deletedAttendanceCount,deletedRequestCount,deletedErrorCount};
}

async function closeAndCsv(){
  const yyyyMM=ymFromMonth($("closeMonth").value);
  const start=$("periodStart").value;
  const end=$("periodEnd").value;

  if(!yyyyMM||!start||!end){
    setMsg("closeMsg","対象月、期間開始、期間終了を入力してください。",true);
    return;
  }

  const ok=confirm(
    "この期間の勤怠を締めてCSVを出力します。\n"+
    "CSV出力後、この期間の勤怠データは削除されます。\n"+
    "CSVファイルと印刷用明細は必ず保管してください。\n"+
    "よろしいですか？"
  );
  if(!ok) return;

  try{
    setMsg("closeMsg","処理中...");

    const rows=await buildCloseRows(yyyyMM);
    downloadCsv(`smart-kintai_${companyCode}_${yyyyMM}_${start}_${end}.csv`,rows);
    buildPrintDetails();

    const deleted=await deletePeriodData(yyyyMM,start,end);

    await postJson(`companies/${companyCode}/logs/closures`,{
      periodStart:start,
      periodEnd:end,
      yyyyMM,
      csvExported:true,
      detailsPrinted:true,
      closedBy:currentUser.uid,
      closedAt:now(),
      attendanceCount:deleted.deletedAttendanceCount,
      requestCount:deleted.deletedRequestCount,
      errorCount:deleted.deletedErrorCount
    });

    await postJson(`companies/${companyCode}/logs/cleanup`,{
      periodStart:start,
      periodEnd:end,
      yyyyMM,
      deletedAttendanceCount:deleted.deletedAttendanceCount,
      deletedRequestCount:deleted.deletedRequestCount,
      deletedErrorCount:deleted.deletedErrorCount,
      csvExported:true,
      deleted:true,
      deletedBy:currentUser.uid,
      deletedAt:now()
    });

    setMsg("closeMsg",
      "CSV出力と締め処理が完了しました。\n"+
      `削除件数：勤怠 ${deleted.deletedAttendanceCount}件 / 申請 ${deleted.deletedRequestCount}件 / エラー ${deleted.deletedErrorCount}件\n`+
      "印刷用明細も作成済みです。"
    );

  }catch(e){
    setMsg("closeMsg",e.message||"締め処理に失敗しました。",true);
  }
}

async function loadLogs(){
  try{
    const edits=await getJson(`companies/${companyCode}/logs/edits`) || {};
    const closures=await getJson(`companies/${companyCode}/logs/closures`) || {};
    const cleanup=await getJson(`companies/${companyCode}/logs/cleanup`) || {};

    let html=`<h3>締め履歴</h3><table><thead><tr><th>期間</th><th>対象月</th><th>CSV</th><th>明細</th><th>件数</th><th>日時</th></tr></thead><tbody>`;
    for(const c of Object.values(closures).sort((a,b)=>(b.closedAt||0)-(a.closedAt||0))){
      html+=`<tr>
        <td>${escapeHtml(c.periodStart||"")}〜${escapeHtml(c.periodEnd||"")}</td>
        <td>${escapeHtml(c.yyyyMM||"")}</td>
        <td>${c.csvExported?"出力済み":""}</td>
        <td>${c.detailsPrinted?"作成済み":""}</td>
        <td>勤怠 ${c.attendanceCount||0} / 申請 ${c.requestCount||0} / エラー ${c.errorCount||0}</td>
        <td>${c.closedAt?new Date(c.closedAt).toLocaleString():""}</td>
      </tr>`;
    }
    html+=`</tbody></table>`;

    html+=`<h3>削除履歴</h3><table><thead><tr><th>期間</th><th>対象月</th><th>削除件数</th><th>日時</th></tr></thead><tbody>`;
    for(const c of Object.values(cleanup).sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0))){
      html+=`<tr>
        <td>${escapeHtml(c.periodStart||"")}〜${escapeHtml(c.periodEnd||"")}</td>
        <td>${escapeHtml(c.yyyyMM||"")}</td>
        <td>勤怠 ${c.deletedAttendanceCount||0} / 申請 ${c.deletedRequestCount||0} / エラー ${c.deletedErrorCount||0}</td>
        <td>${c.deletedAt?new Date(c.deletedAt).toLocaleString():""}</td>
      </tr>`;
    }
    html+=`</tbody></table>`;

    html+=`<h3>編集履歴</h3><table><thead><tr><th>対象</th><th>理由</th><th>日時</th></tr></thead><tbody>`;
    for(const e of Object.values(edits).sort((a,b)=>(b.editedAt||0)-(a.editedAt||0))){
      html+=`<tr>
        <td>${escapeHtml(e.targetPath||"")}</td>
        <td>${escapeHtml(e.reason||"")}</td>
        <td>${e.editedAt?new Date(e.editedAt).toLocaleString():""}</td>
      </tr>`;
    }
    html+=`</tbody></table>`;

    $("logsList").innerHTML=html;
  }catch(e){
    $("logsList").innerHTML=`<p class="ng">${escapeHtml(e.message)}</p>`;
  }
}

function setDefaultMonths(){
  const m=todayMonth();
  $("calMonth").value=m;
  $("attMonth").value=m;
  $("reqMonth").value=m;
  $("errMonth").value=m;
  $("closeMonth").value=m;

  const [y,mo]=m.split("-").map(Number);
  const last=new Date(y,mo,0).getDate();
  $("periodStart").value=`${m}-01`;
  $("periodEnd").value=`${m}-${pad(last)}`;
}
