<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面｜スマート勤怠</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;padding:14px;color:#111827}
.wrap{max-width:1400px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1{font-size:24px;margin:0 0 10px}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-weight:700;margin-top:10px}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid #d1d5db;border-radius:10px;margin-top:5px}
textarea{min-height:70px}
button{padding:10px 12px;font-size:14px;font-weight:800;border:0;border-radius:10px;margin:4px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#e5e7eb;color:#111827}.dark{background:#111827;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.col{flex:1;min-width:180px}
.msg{font-weight:800;white-space:pre-wrap;margin-top:8px}.ok{color:#166534}.ng{color:#dc2626}.small{font-size:13px;color:#6b7280;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{border:1px solid #e5e7eb;padding:7px;text-align:left;vertical-align:top}th{background:#f9fafb}
.tabs button{background:#e5e7eb;color:#111827}.tabs button.active{background:#2563eb;color:#fff}.hidden{display:none}
.printArea{background:#fff;padding:16px}
@media print{
body{background:#fff}body *{visibility:hidden}
#printArea,#printArea *{visibility:visible}
#printArea{position:absolute;left:0;top:0;width:100%}
.noPrint{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">

<div class="noPrint">
  <h1>管理画面</h1>

  <div class="card">
    <h2>管理者情報</h2>
    <div id="adminInfo" class="small">確認中...</div>
    <button class="gray" id="backBtn">ログイン画面へ</button>
    <button class="red" id="logoutBtn">ログアウト</button>
  </div>

  <div class="card tabs">
    <button data-tab="workers" class="active">従業員</button>
    <button data-tab="calendar">会社カレンダー</button>
    <button data-tab="attendance">勤怠確認</button>
    <button data-tab="requests">申請</button>
    <button data-tab="errors">打刻エラー</button>
    <button data-tab="close">締めCSV</button>
  </div>
</div>

<section id="tab-workers" class="card">
<h2>従業員管理</h2>
<div class="row">
  <div class="col"><label>社員コード</label><input id="wCode" placeholder="例：岸澤 / 001 / A001"></div>
  <div class="col"><label>氏名</label><input id="wName" placeholder="氏名"></div>
  <div class="col"><label>個別パスワード</label><input id="wPass" placeholder="例：1234"></div>
  <div class="col"><label>雇用区分</label><select id="wType"><option>正社員</option><option>パート</option><option>アルバイト</option></select></div>
  <div class="col"><label>開始時刻</label><input id="wStart" type="time" value="08:00"></div>
  <div class="col"><label>終了時刻</label><input id="wEnd" type="time" value="17:00"></div>
</div>
<button class="primary" id="saveWorkerBtn">従業員を保存</button>
<div id="workerMsg" class="msg"></div>
<div id="workerList"></div>
</section>

<section id="tab-calendar" class="card hidden">
<h2>会社カレンダー</h2>
<div class="row">
  <div class="col"><label>対象月</label><input id="calMonth" type="month"></div>
  <div class="col"><button class="primary" id="makeWeekdayBtn">平日を出勤日・土日を休日</button></div>
  <div class="col"><button class="green" id="makeAllWorkBtn">全日出勤日</button></div>
  <div class="col"><button class="gray" id="makeAllHolidayBtn">全日休日</button></div>
</div>
<div id="calendarMsg" class="msg"></div>
<div id="calendarList"></div>
</section>

<section id="tab-attendance" class="card hidden">
<h2>勤怠確認・手動編集</h2>
<div class="row">
  <div class="col"><label>対象月</label><input id="attMonth" type="month"></div>
  <div class="col"><button class="primary" id="loadAttendanceBtn">読み込み</button></div>
</div>
<div id="attendanceList"></div>
</section>

<section id="tab-requests" class="card hidden">
<h2>申請一覧</h2>
<div class="row">
  <div class="col"><label>対象月</label><input id="reqMonth" type="month"></div>
  <div class="col"><button class="primary" id="loadRequestsBtn">読み込み</button></div>
</div>
<div id="requestList"></div>
</section>

<section id="tab-errors" class="card hidden">
<h2>打刻エラー一覧</h2>
<div class="row">
  <div class="col"><label>対象月</label><input id="errMonth" type="month"></div>
  <div class="col"><button class="primary" id="loadErrorsBtn">読み込み</button></div>
</div>
<div id="errorList"></div>
</section>

<section id="tab-close" class="card hidden">
<h2>締めてCSV出力</h2>
<div class="row">
  <div class="col"><label>対象月</label><input id="closeMonth" type="month"></div>
  <div class="col"><label>期間開始</label><input id="periodStart" type="date"></div>
  <div class="col"><label>期間終了</label><input id="periodEnd" type="date"></div>
</div>
<button class="red" id="closeBtn">締めてCSV出力</button>
<button class="gray" id="printBtn">印刷用明細を印刷 / PDF保存</button>
<div id="closeMsg" class="msg"></div>
</section>

<section id="printArea" class="printArea hidden"></section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyAokZ3FYeL3qjmZOHhVznhwykvyQu8axp8",
  authDomain:"smart-kintai.firebaseapp.com",
  databaseURL:"https://smart-kintai-default-rtdb.firebaseio.com",
  projectId:"smart-kintai",
  storageBucket:"smart-kintai.firebasestorage.app",
  messagingSenderId:"46581025027",
  appId:"1:46581025027:web:80ca643edc2c202d9f4136",
  measurementId:"G-NY70722CRJ"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const DB_URL=firebaseConfig.databaseURL;
const $=id=>document.getElementById(id);

let companyCode="";
let currentUser=null;
let workers={};
let companyInfo={};
let latestRows=[];

function sanitizeKey(v){return String(v||"").trim().replace(/[.#$/\[\]]/g,"_")}
function pad(n){return String(n).padStart(2,"0")}
function now(){return Date.now()}
function ymFromMonth(v){return String(v||"").replace("-","")}
function todayMonth(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function keyFromDateText(d){return String(d||"").replaceAll("-","")}
function ymdTextFromKey(k){return `${k.slice(0,4)}-${k.slice(4,6)}-${k.slice(6,8)}`}
function minutesText(min){min=Number(min||0);return `${Math.floor(min/60)}:${pad(min%60)}`}
function setMsg(id,text,isError=false){const el=$(id);el.textContent=text;el.className="msg "+(isError?"ng":"ok")}

async function getJson(path){
  const res=await fetch(`${DB_URL}/${path}.json`);
  if(!res.ok) throw new Error("読み込みに失敗しました");
  return await res.json();
}
async function putJson(path,data){
  const res=await fetch(`${DB_URL}/${path}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!res.ok) throw new Error("保存に失敗しました");
  return await res.json();
}
async function patchJson(path,data){
  const res=await fetch(`${DB_URL}/${path}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!res.ok) throw new Error("保存に失敗しました");
  return await res.json();
}
async function deleteJson(path){
  const res=await fetch(`${DB_URL}/${path}.json`,{method:"DELETE"});
  if(!res.ok) throw new Error("削除に失敗しました");
  return await res.json();
}
async function postJson(path,data){
  const res=await fetch(`${DB_URL}/${path}.json`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(!res.ok) throw new Error("保存に失敗しました");
  return await res.json();
}

function getQueryCompany(){
  const p=new URLSearchParams(location.search);
  return sanitizeKey(p.get("company")) || sanitizeKey(localStorage.getItem("smartKintaiAdminCompanyCode")) || "demo";
}

function switchTab(tab){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  document.querySelector(`.tabs button[data-tab="${tab}"]`).classList.add("active");
  ["workers","calendar","attendance","requests","errors","close"].forEach(t=>{
    $(`tab-${t}`).classList.toggle("hidden",t!==tab);
  });
}

async function requireAdmin(){
  companyCode=getQueryCompany();

  onAuthStateChanged(auth,async user=>{
    if(!user){
      alert("管理者ログインが必要です。");
      location.href="index.html";
      return;
    }

    currentUser=user;

    try{
      const allowed=await getJson(`companies/${companyCode}/admins/${user.uid}`);

      if(allowed!==true){
        alert("この会社の管理者として登録されていません。");
        await signOut(auth);
        location.href="index.html";
        return;
      }

      localStorage.setItem("smartKintaiAdminCompanyCode",companyCode);
      companyInfo=await getJson(`companies/${companyCode}/companyInfo`) || {};

      $("adminInfo").innerHTML=`
        会社コード：${companyCode}<br>
        会社名：${companyInfo.companyName||""}<br>
        管理者：${user.email||user.uid}
      `;

      await loadWorkers();

    }catch(e){
      alert("管理者確認に失敗しました。Rulesまたは会社コードを確認してください。");
      location.href="index.html";
    }
  });
}

async function loadWorkers(){
  workers=await getJson(`companies/${companyCode}/workers`) || {};
  renderWorkers();
}

function renderWorkers(){
  const entries=Object.entries(workers||{});
  if(entries.length===0){
    $("workerList").innerHTML=`<p class="small">従業員が登録されていません。</p>`;
    return;
  }

  let html=`<table><thead><tr>
  <th>社員コード</th><th>氏名</th><th>個別パスワード</th><th>区分</th><th>勤務時間</th><th>状態</th><th>操作</th>
  </tr></thead><tbody>`;

  for(const [id,w] of entries){
    html+=`<tr>
      <td>${w.code||id}</td>
      <td>${w.name||""}</td>
      <td>${w.loginPasscode||""}</td>
      <td>${w.employmentType||""}</td>
      <td>${w.workStart||""}〜${w.workEnd||""}</td>
      <td>${w.active===false?"停止":"有効"}</td>
      <td>
        <button class="gray" onclick="editWorker('${id}')">編集</button>
        <button class="${w.active===false?"green":"red"}" onclick="toggleWorker('${id}')">${w.active===false?"有効化":"停止"}</button>
      </td>
    </tr>`;
  }

  html+=`</tbody></table>`;
  $("workerList").innerHTML=html;
}

window.editWorker=function(id){
  const w=workers[id];
  $("wCode").value=w.code||id;
  $("wName").value=w.name||"";
  $("wPass").value=w.loginPasscode||"";
  $("wType").value=w.employmentType||"正社員";
  $("wStart").value=w.workStart||"08:00";
  $("wEnd").value=w.workEnd||"17:00";
  window.scrollTo({top:0,behavior:"smooth"});
};

window.toggleWorker=async function(id){
  const w=workers[id];
  await patchJson(`companies/${companyCode}/workers/${id}`,{
    active:w.active===false?true:false,
    updatedAt:now()
  });
  await loadWorkers();
};

async function saveWorker(){
  const code=sanitizeKey($("wCode").value);
  const name=$("wName").value.trim();
  const pass=$("wPass").value.trim();

  if(!code||!name||!pass){
    setMsg("workerMsg","社員コード、氏名、個別パスワードを入力してください。",true);
    return;
  }

  const existing=await getJson(`companies/${companyCode}/workers/${code}`);

  const data={
    code,
    name,
    loginPasscode:pass,
    employmentType:$("wType").value,
    active:true,
    workStart:$("wStart").value||"08:00",
    workEnd:$("wEnd").value||"17:00",
    usualLocation:existing?.usualLocation || {lat:null,lng:null,updatedAt:0},
    lastClockGps:existing?.lastClockGps || {lat:null,lng:null,updatedAt:0},
    createdAt:existing?.createdAt || now(),
    updatedAt:now()
  };

  await putJson(`companies/${companyCode}/workers/${code}`,data);

  $("wCode").value="";
  $("wName").value="";
  $("wPass").value="";
  setMsg("workerMsg","従業員を保存しました。");
  await loadWorkers();
}

function daysInMonth(monthValue){
  const [y,m]=monthValue.split("-").map(Number);
  return new Date(y,m,0).getDate();
}
function dateKey(monthValue,day){
  const [y,m]=monthValue.split("-");
  return `${y}${m}${pad(day)}`;
}
function dateIso(monthValue,day){
  return `${monthValue}-${pad(day)}`;
}

async function makeCalendar(mode){
  const month=$("calMonth").value;
  if(!month){
    setMsg("calendarMsg","対象月を選んでください。",true);
    return;
  }

  const total=daysInMonth(month);
  const yyyyMM=ymFromMonth(month);
  const updates={};

  for(let d=1;d<=total;d++){
    const key=dateKey(month,d);
    const iso=dateIso(month,d);
    const day=new Date(iso).getDay();
    let dayType="workday";

    if(mode==="weekday") dayType=(day===0||day===6)?"holiday":"workday";
    if(mode==="allWork") dayType="workday";
    if(mode==="allHoliday") dayType="holiday";

    updates[key]={date:iso,dayType,note:"",updatedAt:now(),updatedBy:currentUser.uid};
  }

  await putJson(`companies/${companyCode}/calendar/${yyyyMM}`,updates);
  setMsg("calendarMsg","会社カレンダーを作成しました。");
  await loadCalendar();
}

async function loadCalendar(){
  const month=$("calMonth").value;
  if(!month) return;

  const yyyyMM=ymFromMonth(month);
  const data=await getJson(`companies/${companyCode}/calendar/${yyyyMM}`) || {};

  let html=`<table><thead><tr><th>日付</th><th>区分</th><th>メモ</th><th>保存</th></tr></thead><tbody>`;

  Object.entries(data).sort().forEach(([key,c])=>{
    html+=`<tr>
      <td>${c.date}</td>
      <td><select id="dayType_${key}">
        <option value="workday" ${c.dayType==="workday"?"selected":""}>出勤日</option>
        <option value="holiday" ${c.dayType==="holiday"?"selected":""}>休日</option>
        <option value="closed" ${c.dayType==="closed"?"selected":""}>会社休業日</option>
      </select></td>
      <td><input id="note_${key}" value="${c.note||""}"></td>
      <td><button class="primary" onclick="saveCalendarDay('${yyyyMM}','${key}')">保存</button></td>
    </tr>`;
  });

  html+=`</tbody></table>`;
  $("calendarList").innerHTML=html;
}

window.saveCalendarDay=async function(yyyyMM,key){
  await patchJson(`companies/${companyCode}/calendar/${yyyyMM}/${key}`,{
    dayType:$(`dayType_${key}`).value,
    note:$(`note_${key}`).value,
    updatedAt:now(),
    updatedBy:currentUser.uid
  });
  setMsg("calendarMsg","保存しました。");
};

function calcWorkMinutes(inTime,outTime,breakMinutes){
  if(!inTime||!outTime) return 0;
  const [ih,im]=inTime.split(":").map(Number);
  const [oh,om]=outTime.split(":").map(Number);
  return Math.max(0,(oh*60+om)-(ih*60+im)-Number(breakMinutes||0));
}

async function loadAttendance(){
  const yyyyMM=ymFromMonth($("attMonth").value);
  const data=await getJson(`companies/${companyCode}/attendance/${yyyyMM}`) || {};

  let html=`<table><thead><tr>
  <th>日付</th><th>社員</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>場所</th><th>場所確認</th><th>備考</th><th>操作</th>
  </tr></thead><tbody>`;

  for(const [workerId,days] of Object.entries(data)){
    for(const [dateKey,row] of Object.entries(days||{})){
      const mapIn=row.inGps?`<a target="_blank" href="https://www.google.com/maps?q=${row.inGps.lat},${row.inGps.lng}">出勤GPS</a>`:"";
      const mapOut=row.outGps?`<a target="_blank" href="https://www.google.com/maps?q=${row.outGps.lat},${row.outGps.lng}">退勤GPS</a>`:"";

      html+=`<tr>
        <td>${row.date||ymdTextFromKey(dateKey)}</td>
        <td>${row.workerName||workerId}<br>${row.workerCode||""}</td>
        <td><input id="in_${workerId}_${dateKey}" type="time" value="${row.inTime||""}"></td>
        <td><input id="out_${workerId}_${dateKey}" type="time" value="${row.outTime||""}"></td>
        <td><input id="br_${workerId}_${dateKey}" type="number" value="${row.breakMinutes||0}"></td>
        <td>${minutesText(row.workMinutes||0)}</td>
        <td>${mapIn}<br>${mapOut}</td>
        <td>
          <select id="loc_${workerId}_${dateKey}">
            <option value="none" ${!row.locationApproval||row.locationApproval==="none"?"selected":""}>なし</option>
            <option value="pending" ${row.locationApproval==="pending"?"selected":""}>確認待ち</option>
            <option value="approved" ${row.locationApproval==="approved"?"selected":""}>承認</option>
            <option value="rejected" ${row.locationApproval==="rejected"?"selected":""}>否決</option>
          </select>
        </td>
        <td><input id="notea_${workerId}_${dateKey}" value="${row.note||""}"></td>
        <td><button class="primary" onclick="saveAttendanceEdit('${yyyyMM}','${workerId}','${dateKey}')">保存</button></td>
      </tr>`;
    }
  }

  html+=`</tbody></table>`;
  $("attendanceList").innerHTML=html;
}

window.saveAttendanceEdit=async function(yyyyMM,workerId,dateKey){
  const path=`companies/${companyCode}/attendance/${yyyyMM}/${workerId}/${dateKey}`;
  const before=await getJson(path);

  const inTime=$(`in_${workerId}_${dateKey}`).value;
  const outTime=$(`out_${workerId}_${dateKey}`).value;
  const breakMinutes=Number($(`br_${workerId}_${dateKey}`).value||0);
  const note=$(`notea_${workerId}_${dateKey}`).value;
  const locationApproval=$(`loc_${workerId}_${dateKey}`).value;
  const workMinutes=calcWorkMinutes(inTime,outTime,breakMinutes);

  const after={inTime,outTime,breakMinutes,workMinutes,note,locationApproval,updatedAt:now()};

  await patchJson(path,after);
  await postJson(`companies/${companyCode}/logs/edits`,{
    targetPath:path,before,after,editedBy:currentUser.uid,editedAt:now(),reason:"管理者による勤怠手動編集"
  });

  alert("保存しました。");
  await loadAttendance();
};

function requestTypeText(t){
  return {early_work:"早出申請",overtime:"残業申請",holiday_work:"休日出勤申請",clock_fix:"打刻修正申請"}[t]||t;
}
function statusText(s){return s==="approved"?"承認済み":s==="rejected"?"否決":"確認待ち"}

async function loadRequests(){
  const yyyyMM=ymFromMonth($("reqMonth").value);
  const data=await getJson(`companies/${companyCode}/requests/${yyyyMM}`) || {};

  let html=`<table><thead><tr><th>日付</th><th>社員</th><th>種別</th><th>時間</th><th>理由</th><th>状態</th><th>操作</th></tr></thead><tbody>`;

  for(const [id,r] of Object.entries(data)){
    html+=`<tr>
      <td>${r.date||""}</td>
      <td>${r.workerName||""}<br>${r.workerCode||""}</td>
      <td>${requestTypeText(r.type)}</td>
      <td>${r.startTime||""}〜${r.endTime||""}</td>
      <td>${r.reason||""}</td>
      <td>${statusText(r.status)}</td>
      <td>
        <button class="green" onclick="judgeRequest('${yyyyMM}','${id}','approved')">承認</button>
        <button class="red" onclick="judgeRequest('${yyyyMM}','${id}','rejected')">否決</button>
      </td>
    </tr>`;
  }

  html+=`</tbody></table>`;
  $("requestList").innerHTML=html;
}

window.judgeRequest=async function(yyyyMM,id,status){
  await patchJson(`companies/${companyCode}/requests/${yyyyMM}/${id}`,{
    status,approvedBy:currentUser.uid,approvedAt:now(),updatedAt:now()
  });
  await loadRequests();
};

async function loadErrors(){
  const yyyyMM=ymFromMonth($("errMonth").value);
  const data=await getJson(`companies/${companyCode}/errors/${yyyyMM}`) || {};

  let html=`<table><thead><tr><th>日付</th><th>社員</th><th>内容</th><th>場所</th><th>状態</th><th>操作</th></tr></thead><tbody>`;

  for(const [id,e] of Object.entries(data)){
    const map=e.gps?`<a target="_blank" href="https://www.google.com/maps?q=${e.gps.lat},${e.gps.lng}">地図で確認</a>`:"";
    html+=`<tr>
      <td>${e.date||""}</td>
      <td>${e.workerName||""}<br>${e.workerCode||""}</td>
      <td><b>${e.title||e.type}</b><br>${e.message||""}</td>
      <td>${map}</td>
      <td>${statusText(e.status)}</td>
      <td>
        <button class="green" onclick="judgeError('${yyyyMM}','${id}','approved')">承認</button>
        <button class="red" onclick="judgeError('${yyyyMM}','${id}','rejected')">否決</button>
      </td>
    </tr>`;
  }

  html+=`</tbody></table>`;
  $("errorList").innerHTML=html;
}

window.judgeError=async function(yyyyMM,id,status){
  const e=await getJson(`companies/${companyCode}/errors/${yyyyMM}/${id}`);
  await patchJson(`companies/${companyCode}/errors/${yyyyMM}/${id}`,{
    status,approvedBy:currentUser.uid,approvedAt:now(),updatedAt:now()
  });

  if(e&&e.workerId&&e.date){
    const dateKey=keyFromDateText(e.date);
    const patch={};
    if(e.type==="location_difference") patch.locationApproval=status;
    if(e.type==="late") patch.late=status==="approved";
    if(e.type==="early_leave") patch.earlyLeave=status==="approved";
    if(Object.keys(patch).length){
      patch.updatedAt=now();
      await patchJson(`companies/${companyCode}/attendance/${yyyyMM}/${e.workerId}/${dateKey}`,patch);
    }
  }

  await loadErrors();
};

function csvEscape(v){const s=String(v??"");return `"${s.replaceAll('"','""')}"`}
function downloadCsv(filename,rows){
  const csv=rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  a.click();
  URL.revokeObjectURL(url);
}
function sumReqMinutes(reqs,type){
  return reqs.filter(r=>r.type===type).reduce((sum,r)=>{
    if(!r.startTime||!r.endTime) return sum;
    const [sh,sm]=r.startTime.split(":").map(Number);
    const [eh,em]=r.endTime.split(":").map(Number);
    return sum+Math.max(0,(eh*60+em)-(sh*60+sm));
  },0);
}
function countNestedAttendance(att){
  let count=0;
  for(const days of Object.values(att||{})) count+=Object.keys(days||{}).length;
  return count;
}

async function buildCloseRows(yyyyMM){
  const attendance=await getJson(`companies/${companyCode}/attendance/${yyyyMM}`) || {};
  const requests=await getJson(`companies/${companyCode}/requests/${yyyyMM}`) || {};
  const approvedRequests=Object.values(requests||{}).filter(r=>r.status==="approved");

  const header=["会社名","対象期間","社員コード","氏名","日付","出勤","退勤","出勤GPS","退勤GPS","休憩","実働","早出","残業","休日出勤","遅刻","早退","欠勤","承認状況","備考"];
  const period=`${$("periodStart").value}〜${$("periodEnd").value}`;
  const rows=[header];
  latestRows=[];

  for(const [workerId,days] of Object.entries(attendance)){
    for(const [dateKey,row] of Object.entries(days||{})){
      const dayReqs=approvedRequests.filter(r=>r.workerId===workerId && keyFromDateText(r.date)===dateKey);
      const early=sumReqMinutes(dayReqs,"early_work");
      const overtime=sumReqMinutes(dayReqs,"overtime");
      const holiday=sumReqMinutes(dayReqs,"holiday_work");

      rows.push([
        companyInfo.companyName||companyCode,period,row.workerCode||workerId,row.workerName||"",
        row.date||ymdTextFromKey(dateKey),row.inTime||"",row.outTime||"",
        row.inGps?`${row.inGps.lat},${row.inGps.lng}`:"",
        row.outGps?`${row.outGps.lat},${row.outGps.lng}`:"",
        row.breakMinutes||0,row.workMinutes||0,early,overtime,holiday,
        row.late?"あり":"",row.earlyLeave?"あり":"",row.absence?"あり":"",
        row.approvalStatus||row.locationApproval||"",row.note||""
      ]);

      latestRows.push({workerId,dateKey,row,early,overtime,holiday});
    }
  }
  return rows;
}

function buildPrintDetails(){
  const byWorker={};
  for(const item of latestRows){
    if(!byWorker[item.workerId]) byWorker[item.workerId]=[];
    byWorker[item.workerId].push(item);
  }

  let html="";

  for(const [workerId,items] of Object.entries(byWorker)){
    const first=items[0].row;
    let workDays=0,absence=0,totalWork=0,totalBreak=0,totalOver=0,totalHoliday=0,lateCount=0,earlyLeaveCount=0;

    html+=`<div style="page-break-after:always;">
      <h2>勤怠明細</h2>
      <p>
        会社名：${companyInfo.companyName||companyCode}<br>
        氏名：${first.workerName||""}<br>
        社員コード：${first.workerCode||workerId}<br>
        対象期間：${$("periodStart").value}〜${$("periodEnd").value}
      </p>
      <table><thead><tr>
      <th>日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>早出</th><th>残業</th><th>休日出勤</th><th>遅刻</th><th>早退</th><th>欠勤</th><th>備考</th>
      </tr></thead><tbody>`;

    for(const item of items.sort((a,b)=>a.dateKey.localeCompare(b.dateKey))){
      const r=item.row;
      if(r.inTime) workDays++;
      if(r.absence) absence++;
      totalWork+=Number(r.workMinutes||0);
      totalBreak+=Number(r.breakMinutes||0);
      totalOver+=Number(item.overtime||0);
      totalHoliday+=Number(item.holiday||0);
      if(r.late) lateCount++;
      if(r.earlyLeave) earlyLeaveCount++;

      html+=`<tr>
        <td>${r.date||ymdTextFromKey(item.dateKey)}</td><td>${r.inTime||""}</td><td>${r.outTime||""}</td>
        <td>${r.breakMinutes||0}</td><td>${minutesText(r.workMinutes||0)}</td>
        <td>${item.early||0}</td><td>${item.overtime||0}</td><td>${item.holiday||0}</td>
        <td>${r.late?"あり":""}</td><td>${r.earlyLeave?"あり":""}</td><td>${r.absence?"あり":""}</td><td>${r.note||""}</td>
      </tr>`;
    }

    html+=`</tbody></table>
      <h3>月合計</h3>
      <p>
      出勤日数：${workDays}<br>
      欠勤日数：${absence}<br>
      実働合計：${minutesText(totalWork)}<br>
      休憩合計：${minutesText(totalBreak)}<br>
      承認済み残業合計：${minutesText(totalOver)}<br>
      休日出勤合計：${minutesText(totalHoliday)}<br>
      遅刻回数：${lateCount}<br>
      早退回数：${earlyLeaveCount}
      </p>
    </div>`;
  }

  $("printArea").innerHTML=html;
  $("printArea").classList.remove("hidden");
}

async function closeAndCsv(){
  const yyyyMM=ymFromMonth($("closeMonth").value);
  if(!yyyyMM||!$("periodStart").value||!$("periodEnd").value){
    setMsg("closeMsg","対象月、期間開始、期間終了を入力してください。",true);
    return;
  }

  const ok=confirm(
    "この期間の勤怠を締めてCSVを出力します。\n"+
    "CSV出力後、この期間の勤怠データは削除されます。\n"+
    "CSVファイルと印刷用明細は必ず保管してください。\n"+
    "よろしいですか？"
  );
  if(!ok) return;

  try{
    setMsg("closeMsg","処理中...");

    const attendance=await getJson(`companies/${companyCode}/attendance/${yyyyMM}`) || {};
    const requests=await getJson(`companies/${companyCode}/requests/${yyyyMM}`) || {};
    const errors=await getJson(`companies/${companyCode}/errors/${yyyyMM}`) || {};
    const attendanceCount=countNestedAttendance(attendance);
    const requestCount=Object.keys(requests).length;
    const errorCount=Object.keys(errors).length;

    const rows=await buildCloseRows(yyyyMM);
    downloadCsv(`smart-kintai_${companyCode}_${yyyyMM}.csv`,rows);
    buildPrintDetails();

    await postJson(`companies/${companyCode}/logs/closures`,{
      periodStart:$("periodStart").value,periodEnd:$("periodEnd").value,yyyyMM,
      csvExported:true,detailsPrinted:true,closedBy:currentUser.uid,closedAt:now(),
      attendanceCount,requestCount,errorCount
    });

    await deleteJson(`companies/${companyCode}/attendance/${yyyyMM}`);
    await deleteJson(`companies/${companyCode}/requests/${yyyyMM}`);
    await deleteJson(`companies/${companyCode}/errors/${yyyyMM}`);

    await postJson(`companies/${companyCode}/logs/cleanup`,{
      periodStart:$("periodStart").value,periodEnd:$("periodEnd").value,yyyyMM,
      deletedAttendanceCount:attendanceCount,deletedRequestCount:requestCount,deletedErrorCount:errorCount,
      csvExported:true,deleted:true,deletedBy:currentUser.uid,deletedAt:now()
    });

    setMsg("closeMsg","CSV出力と締め処理が完了しました。印刷用明細も作成済みです。");
  }catch(e){
    setMsg("closeMsg",e.message||"締め処理に失敗しました。",true);
  }
}

function setDefaultMonths(){
  const m=todayMonth();
  $("calMonth").value=m;
  $("attMonth").value=m;
  $("reqMonth").value=m;
  $("errMonth").value=m;
  $("closeMonth").value=m;

  const [y,mo]=m.split("-").map(Number);
  const last=new Date(y,mo,0).getDate();
  $("periodStart").value=`${m}-01`;
  $("periodEnd").value=`${m}-${pad(last)}`;
}
