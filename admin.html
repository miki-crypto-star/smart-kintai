<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理者画面｜Smart勤怠</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    header {
      background: #111827;
      color: white;
      padding: 16px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
    }
    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .9;
    }
    main {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 14px 40px;
    }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,.05);
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: end;
    }
    .row > div {
      flex: 1;
      min-width: 180px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 13px;
      font-weight: 800;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }
    button {
      border: 0;
      border-radius: 11px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 800;
      color: white;
      background: #111827;
      cursor: pointer;
    }
    button.blue {
      background: #2563eb;
    }
    button.red {
      background: #dc2626;
    }
    button.gray {
      background: #6b7280;
    }
    .status {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }
    .ok {
      display: block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .ng {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .warn {
      display: block;
      background: #fffbeb;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: white;
      margin-top: 10px;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 8px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f9fafb;
    }
    .scroll {
      overflow-x: auto;
    }
    .small {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.7;
    }
    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      background: #e5e7eb;
    }
    .active {
      background: #dcfce7;
      color: #166534;
    }
    .inactive {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>

<header>
  <h1>Smart勤怠 管理者画面</h1>
  <p id="headerInfo">確認中...</p>
</header>

<main>
  <section class="card">
    <h2>会社情報</h2>
    <div id="companyBox" class="small">読み込み中...</div>
    <div id="mainStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>本日の勤怠確認</h2>
    <p class="small">次の段階で、労働者の出勤・退勤データをここに表示します。</p>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>社員コード</th>
            <th>氏名</th>
            <th>出勤</th>
            <th>退勤</th>
            <th>状態</th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody id="todayBody">
          <tr>
            <td colspan="6">まだ打刻データはありません。</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>労働者管理</h2>
    <p class="small">
      完全削除はせず、使わなくなった労働者は active:false で無効化します。
    </p>

    <div class="row">
      <div>
        <label>社員コード</label>
        <input id="workerCode" placeholder="例：EMP002">
      </div>
      <div>
        <label>氏名</label>
        <input id="workerName" placeholder="例：佐藤花子">
      </div>
      <div>
        <label>雇用区分</label>
        <select id="employmentType">
          <option value="正社員">正社員</option>
          <option value="パート">パート</option>
          <option value="アルバイト">アルバイト</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>開始時刻</label>
        <input id="workStart" type="time" value="08:00">
      </div>
      <div>
        <label>終了時刻</label>
        <input id="workEnd" type="time" value="17:00">
      </div>
      <div>
        <button id="saveWorkerBtn" class="blue">労働者を追加 / 更新</button>
      </div>
    </div>

    <div id="workerStatus" class="status"></div>

    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>社員コード</th>
            <th>氏名</th>
            <th>雇用区分</th>
            <th>勤務時間</th>
            <th>状態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="workerBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2>次に追加する機能</h2>
    <p class="small">
      次のステップで worker.html を追加し、労働者の出勤・退勤打刻、GPS取得、打刻データ保存まで進めます。
    </p>
  </section>

  <section class="card">
    <button id="logoutBtn" class="gray">ログアウト</button>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    getDatabase,
    ref,
    get,
    update
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAokZ3FYeL3qjmZOHhVznhwykvyQu8axp8",
    authDomain: "smart-kintai.firebaseapp.com",
    databaseURL: "https://smart-kintai-default-rtdb.firebaseio.com",
    projectId: "smart-kintai",
    storageBucket: "smart-kintai.firebasestorage.app",
    messagingSenderId: "46581025027",
    appId: "1:46581025027:web:80ca643edc2c202d9f4136",
    measurementId: "G-NY70722CRJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const $ = (id) => document.getElementById(id);

  let companyCode = "";
  let currentUser = null;
  let companyData = null;

  function showStatus(id, message, type = "ok") {
    const el = $(id);
    el.textContent = message;
    el.className = "status " + type;
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function clean(value) {
    return String(value || "").trim();
  }

  function safeKey(value) {
    return clean(value).replace(/[.#$/\[\]]/g, "_");
  }

  function getCompanyCodeFromUrlOrStorage() {
    const params = new URLSearchParams(location.search);
    const fromUrl = params.get("company");
    if (fromUrl) return fromUrl;

    const saved = JSON.parse(localStorage.getItem("smart_kintai_admin") || "null");
    return saved?.companyCode || "demo";
  }

  async function loadCompany() {
    const snap = await get(ref(db, `companies/${companyCode}`));
    if (!snap.exists()) {
      throw new Error("会社データが見つかりません。");
    }
    companyData = snap.val();
  }

  async function checkAdmin(uid) {
    const snap = await get(ref(db, `companies/${companyCode}/members/${uid}`));
    if (!snap.exists()) return false;

    const member = snap.val();
    return member.role === "admin" && member.active === true;
  }

  function renderCompany() {
    const info = companyData.companyInfo || {};
    const settings = companyData.settings || {};

    $("companyBox").innerHTML = `
      <p><strong>会社コード：</strong>${info.companyCode || companyCode}</p>
      <p><strong>会社名：</strong>${info.companyName || ""}</p>
      <p><strong>締め日：</strong>${settings.close?.closeDay === "end" ? "月末" : settings.close?.closeDay + "日"}</p>
      <p><strong>保存期間：</strong>${settings.close?.retentionMonths || 3}か月</p>
      <p><strong>標準勤務：</strong>${settings.work?.defaultStart || "08:00"}〜${settings.work?.defaultEnd || "17:00"}</p>
    `;

    $("headerInfo").textContent = `${info.companyName || companyCode} / 管理者`;
  }

  function renderWorkers() {
    const workers = companyData.workers || {};
    const entries = Object.entries(workers);

    if (!entries.length) {
      $("workerBody").innerHTML = `<tr><td colspan="6">労働者が登録されていません。</td></tr>`;
      return;
    }

    $("workerBody").innerHTML = entries.map(([id, w]) => {
      const isActive = w.active !== false;
      return `
        <tr>
          <td>${w.code || id}</td>
          <td>${w.name || ""}</td>
          <td>${w.employmentType || ""}</td>
          <td>${w.workStart || ""}〜${w.workEnd || ""}</td>
          <td>
            <span class="pill ${isActive ? "active" : "inactive"}">
              ${isActive ? "有効" : "無効"}
            </span>
          </td>
          <td>
            <button class="gray" data-edit="${id}">編集</button>
            <button class="${isActive ? "red" : "blue"}" data-toggle="${id}">
              ${isActive ? "無効化" : "有効化"}
            </button>
          </td>
        </tr>
      `;
    }).join("");

    document.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => fillWorkerForm(btn.dataset.edit));
    });

    document.querySelectorAll("[data-toggle]").forEach(btn => {
      btn.addEventListener("click", () => toggleWorker(btn.dataset.toggle));
    });
  }

  function fillWorkerForm(workerId) {
    const w = companyData.workers?.[workerId];
    if (!w) return;

    $("workerCode").value = w.code || workerId;
    $("workerName").value = w.name || "";
    $("employmentType").value = w.employmentType || "正社員";
    $("workStart").value = w.workStart || companyData.settings?.work?.defaultStart || "08:00";
    $("workEnd").value = w.workEnd || companyData.settings?.work?.defaultEnd || "17:00";

    showStatus("workerStatus", "編集内容をフォームに読み込みました。変更後に保存してください。", "ok");
  }

  async function saveWorker() {
    try {
      const code = clean($("workerCode").value);
      const name = clean($("workerName").value);
      const employmentType = $("employmentType").value;
      const workStart = $("workStart").value || "08:00";
      const workEnd = $("workEnd").value || "17:00";

      if (!code || !name) {
        showStatus("workerStatus", "社員コードと氏名を入力してください。", "ng");
        return;
      }

      const workerId = safeKey(code);
      const old = companyData.workers?.[workerId] || {};

      await update(ref(db, `companies/${companyCode}/workers/${workerId}`), {
        code,
        name,
        employmentType,
        active: old.active === false ? false : true,
        authUid: old.authUid || "",
        loginEmail: old.loginEmail || "",
        workStart,
        workEnd,
        usualLocation: old.usualLocation || null,
        lastClockGps: old.lastClockGps || null,
        createdAt: old.createdAt || nowIso(),
        updatedAt: nowIso()
      });

      await update(ref(db, `companies/${companyCode}/logs/edits/${Date.now()}`), {
        action: "save_worker",
        workerId,
        adminUid: currentUser.uid,
        createdAt: nowIso()
      });

      showStatus("workerStatus", "労働者を保存しました。", "ok");

      $("workerCode").value = "";
      $("workerName").value = "";
      $("employmentType").value = "正社員";
      $("workStart").value = companyData.settings?.work?.defaultStart || "08:00";
      $("workEnd").value = companyData.settings?.work?.defaultEnd || "17:00";

      await loadCompany();
      renderWorkers();

    } catch (e) {
      console.error(e);
      showStatus("workerStatus", "労働者を保存できませんでした。Rulesまたは通信状態を確認してください。", "ng");
    }
  }

  async function toggleWorker(workerId) {
    try {
      const w = companyData.workers?.[workerId];
      if (!w) return;

      const nextActive = w.active === false;

      await update(ref(db, `companies/${companyCode}/workers/${workerId}`), {
        active: nextActive,
        updatedAt: nowIso()
      });

      await update(ref(db, `companies/${companyCode}/logs/edits/${Date.now()}`), {
        action: nextActive ? "activate_worker" : "disable_worker",
        workerId,
        adminUid: currentUser.uid,
        createdAt: nowIso()
      });

      await loadCompany();
      renderWorkers();

    } catch (e) {
      console.error(e);
      showStatus("workerStatus", "状態変更できませんでした。", "ng");
    }
  }

  async function init() {
    companyCode = getCompanyCodeFromUrlOrStorage();

    onAuthStateChanged(auth, async (user) => {
      try {
        if (!user) {
          location.href = "index.html";
          return;
        }

        currentUser = user;

        const ok = await checkAdmin(user.uid);
        if (!ok) {
          await signOut(auth);
          localStorage.removeItem("smart_kintai_admin");
          location.href = "index.html";
          return;
        }

        await loadCompany();
        renderCompany();
        renderWorkers();

        showStatus("mainStatus", "管理者ログイン確認済みです。", "ok");

      } catch (e) {
        console.error(e);
        showStatus("mainStatus", "管理者画面の読み込みに失敗しました。Firebase Rules・初期JSONを確認してください。", "ng");
      }
    });
  }

  $("saveWorkerBtn").addEventListener("click", saveWorker);

  $("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    localStorage.removeItem("smart_kintai_admin");
    location.href = "index.html";
  });

  init();
</script>
</body>
</html>
