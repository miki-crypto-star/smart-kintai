<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面｜スマート勤怠</title>

<style>
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:14px;
  color:#111827;
}

.wrap{
  max-width:1400px;
  margin:0 auto;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}

h1{
  margin:0 0 12px;
  font-size:24px;
}

h2{
  margin:0 0 12px;
  font-size:18px;
}

label{
  display:block;
  margin-top:10px;
  font-weight:700;
}

input,select,textarea{
  width:100%;
  box-sizing:border-box;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:10px;
  margin-top:5px;
  font-size:15px;
}

textarea{
  min-height:80px;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

button:disabled{
  opacity:.6;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.green{
  background:#16a34a;
  color:#fff;
}

.red{
  background:#dc2626;
  color:#fff;
}

.gray{
  background:#e5e7eb;
}

.dark{
  background:#111827;
  color:#fff;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.col{
  flex:1;
  min-width:180px;
}

.msg{
  margin-top:10px;
  font-weight:700;
  white-space:pre-wrap;
}

.ok{
  color:#166534;
}

.ng{
  color:#dc2626;
}

.small{
  font-size:13px;
  color:#6b7280;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
}

th,td{
  border:1px solid #e5e7eb;
  padding:8px;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f9fafb;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tabs button.active{
  background:#2563eb;
  color:#fff;
}

.hidden{
  display:none;
}

.printArea{
  background:#fff;
  padding:20px;
}

@media print{
  body *{
    visibility:hidden;
  }

  #printArea,#printArea *{
    visibility:visible;
  }

  #printArea{
    position:absolute;
    left:0;
    top:0;
    width:100%;
  }

  .noPrint{
    display:none !important;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card noPrint">
  <h1>管理画面</h1>

  <div id="adminInfo"></div>

  <button class="gray" id="backBtn">ログイン画面へ</button>
  <button class="red" id="logoutBtn">ログアウト</button>
</div>

<div class="card noPrint">
  <div class="tabs">
    <button class="active" data-tab="workers">従業員</button>
    <button data-tab="calendar">会社カレンダー</button>
    <button data-tab="attendance">勤怠確認</button>
    <button data-tab="requests">申請</button>
    <button data-tab="errors">打刻エラー</button>
    <button data-tab="close">締めCSV</button>
  </div>
</div>

<section id="tab-workers" class="card">

<h2>従業員管理</h2>

<div class="row">

<div class="col">
<label>社員コード</label>
<input id="wCode">
</div>

<div class="col">
<label>氏名</label>
<input id="wName">
</div>

<div class="col">
<label>個別パスワード</label>
<input id="wPass">
</div>

<div class="col">
<label>雇用区分</label>
<select id="wType">
<option>正社員</option>
<option>パート</option>
<option>アルバイト</option>
</select>
</div>

<div class="col">
<label>開始時刻</label>
<input id="wStart" type="time" value="08:00">
</div>

<div class="col">
<label>終了時刻</label>
<input id="wEnd" type="time" value="17:00">
</div>

</div>

<button class="primary" id="saveWorkerBtn">従業員を保存</button>

<div id="workerMsg" class="msg"></div>

<div id="workerList"></div>

</section>

<section id="tab-calendar" class="card hidden">

<h2>会社カレンダー</h2>

<div class="row">

<div class="col">
<label>対象月</label>
<input id="calMonth" type="month">
</div>

<div class="col">
<button class="primary" id="weekdayBtn">
平日を出勤日・土日を休日
</button>
</div>

<div class="col">
<button class="green" id="allWorkBtn">
全日出勤日
</button>
</div>

<div class="col">
<button class="gray" id="allHolidayBtn">
全日休日
</button>
</div>

</div>

<div id="calendarMsg" class="msg"></div>

<div id="calendarList"></div>

</section>

<section id="tab-attendance" class="card hidden">

<h2>勤怠確認・編集</h2>

<div class="row">

<div class="col">
<label>対象月</label>
<input id="attMonth" type="month">
</div>

<div class="col">
<button class="primary" id="loadAttendanceBtn">
読み込み
</button>
</div>

</div>

<div id="attendanceList"></div>

</section>

<section id="tab-requests" class="card hidden">

<h2>申請一覧</h2>

<div class="row">

<div class="col">
<label>対象月</label>
<input id="reqMonth" type="month">
</div>

<div class="col">
<button class="primary" id="loadRequestsBtn">
読み込み
</button>
</div>

</div>

<div id="requestList"></div>

</section>

<section id="tab-errors" class="card hidden">

<h2>打刻エラー一覧</h2>

<div class="row">

<div class="col">
<label>対象月</label>
<input id="errMonth" type="month">
</div>

<div class="col">
<button class="primary" id="loadErrorsBtn">
読み込み
</button>
</div>

</div>

<div id="errorList"></div>

</section>

<section id="tab-close" class="card hidden">

<h2>締めてCSV出力</h2>

<div class="row">

<div class="col">
<label>対象月</label>
<input id="closeMonth" type="month">
</div>

<div class="col">
<label>期間開始</label>
<input id="periodStart" type="date">
</div>

<div class="col">
<label>期間終了</label>
<input id="periodEnd" type="date">
</div>

</div>

<button class="red" id="closeBtn">
締めてCSV出力
</button>

<button class="gray" id="printBtn">
印刷用明細を印刷 / PDF保存
</button>

<div class="small">
CSV出力後、この期間の attendance / requests / errors は削除されます。
CSVファイルと印刷用明細は必ず保管してください。
</div>

<div id="closeMsg" class="msg"></div>

</section>

<section id="printArea" class="printArea hidden"></section>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAokZ3FYeL3qjmZOHhVznhwykvyQu8axp8",
  authDomain: "smart-kintai.firebaseapp.com",
  databaseURL: "https://smart-kintai-default-rtdb.firebaseio.com",
  projectId: "smart-kintai",
  storageBucket: "smart-kintai.firebasestorage.app",
  messagingSenderId: "46581025027",
  appId: "1:46581025027:web:80ca643edc2c202d9f4136",
  measurementId: "G-NY70722CRJ"
};

initializeApp(firebaseConfig);

const auth = getAuth();

const DB_URL = firebaseConfig.databaseURL;

const $ = id => document.getElementById(id);

let companyCode = "";
let currentUser = null;
let workers = {};
let companyInfo = {};
let latestRows = [];

function sanitizeKey(value){
  return String(value || "").trim().replace(/[.#$/\[\]]/g,"_");
}

function pad(n){
  return String(n).padStart(2,"0");
}

function ym(monthInput){
  return String(monthInput || "").replace("-","");
}

function now(){
  return Date.now();
}

function todayMonth(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
}

function setMsg(id,text,isError=false){
  const el = $(id);
  el.textContent = text;
  el.className = "msg " + (isError ? "ng" : "ok");
}

async function getJson(path){
  const res = await fetch(`${DB_URL}/${path}.json`);
  if(!res.ok) throw new Error("通信失敗");
  return await res.json();
}

async function putJson(path,data){
  const res = await fetch(`${DB_URL}/${path}.json`,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(data)
  });

  if(!res.ok) throw new Error("保存失敗");

  return await res.json();
}

async function patchJson(path,data){
  const res = await fetch(`${DB_URL}/${path}.json`,{
    method:"PATCH",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(data)
  });

  if(!res.ok) throw new Error("保存失敗");

  return await res.json();
}

async function deleteJson(path){
  const res = await fetch(`${DB_URL}/${path}.json`,{
    method:"DELETE"
  });

  if(!res.ok) throw new Error("削除失敗");

  return await res.json();
}

async function postJson(path,data){
  const res = await fetch(`${DB_URL}/${path}.json`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(data)
  });

  if(!res.ok) throw new Error("保存失敗");

  return await res.json();
}

function switchTab(tab){

  document.querySelectorAll(".tabs button")
    .forEach(btn=>btn.classList.remove("active"));

  document.querySelector(`[data-tab="${tab}"]`)
    .classList.add("active");

  [
    "workers",
    "calendar",
    "attendance",
    "requests",
    "errors",
    "close"
  ].forEach(name=>{

    $(`tab-${name}`).classList.toggle(
      "hidden",
      name !== tab
    );

  });
}

async function requireAdmin(){

  const params = new URLSearchParams(location.search);

  companyCode =
    sanitizeKey(params.get("company")) ||
    sanitizeKey(localStorage.getItem("smartKintaiAdminCompanyCode"));

  if(!companyCode){
    location.href = "index.html";
    return;
  }

  onAuthStateChanged(auth, async user=>{

    if(!user){
      location.href = "index.html";
      return;
    }

    currentUser = user;

    const allowed =
      await getJson(`companies/${companyCode}/admins/${user.uid}`);

    if(allowed !== true){
      alert("管理権限がありません");
      await signOut(auth);
      location.href = "index.html";
      return;
    }

    localStorage.setItem(
      "smartKintaiAdminCompanyCode",
      companyCode
    );

    companyInfo =
      await getJson(`companies/${companyCode}/companyInfo`) || {};

    $("adminInfo").innerHTML = `
      会社コード：${companyCode}<br>
      会社名：${companyInfo.companyName || ""}<br>
      管理者：${user.email || ""}
    `;

    await loadWorkers();

  });
}

async function loadWorkers(){

  workers =
    await getJson(`companies/${companyCode}/workers`) || {};

  renderWorkers();
}

function renderWorkers(){

  const entries = Object.entries(workers);

  if(entries.length === 0){
    $("workerList").innerHTML =
      `<div class="small">従業員未登録</div>`;
    return;
  }

  let html = `
  <table>
  <thead>
  <tr>
  <th>社員コード</th>
  <th>氏名</th>
  <th>パスワード</th>
  <th>区分</th>
  <th>勤務時間</th>
  <th>状態</th>
  <th>操作</th>
  </tr>
  </thead>
  <tbody>
  `;

  for(const [id,w] of entries){

    html += `
    <tr>
      <td>${w.code || id}</td>
      <td>${w.name || ""}</td>
      <td>${w.loginPasscode || ""}</td>
      <td>${w.employmentType || ""}</td>
      <td>${w.workStart || ""}〜${w.workEnd || ""}</td>
      <td>${w.active === false ? "停止" : "有効"}</td>
      <td>
        <button class="gray" onclick="editWorker('${id}')">
          編集
        </button>

        <button class="${w.active === false ? "green" : "red"}"
          onclick="toggleWorker('${id}')">
          ${w.active === false ? "有効化" : "停止"}
        </button>
      </td>
    </tr>
    `;
  }

  html += `</tbody></table>`;

  $("workerList").innerHTML = html;
}

window.editWorker = function(id){

  const w = workers[id];

  $("wCode").value = w.code || id;
  $("wName").value = w.name || "";
  $("wPass").value = w.loginPasscode || "";
  $("wType").value = w.employmentType || "正社員";
  $("wStart").value = w.workStart || "08:00";
  $("wEnd").value = w.workEnd || "17:00";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
};

window.toggleWorker = async function(id){

  const w = workers[id];

  await patchJson(
    `companies/${companyCode}/workers/${id}`,
    {
      active: w.active === false ? true : false,
      updatedAt: now()
    }
  );

  await loadWorkers();
};

async function saveWorker(){

  const code = sanitizeKey($("wCode").value);
  const name = $("wName").value.trim();
  const pass = $("wPass").value.trim();

  if(!code || !name || !pass){

    setMsg(
      "workerMsg",
      "社員コード・氏名・パスワードを入力してください",
      true
    );

    return;
  }

  const existing =
    await getJson(`companies/${companyCode}/workers/${code}`);

  const data = {

    code,
    name,

    loginPasscode: pass,

    employmentType: $("wType").value,

    active: true,

    workStart: $("wStart").value || "08:00",
    workEnd: $("wEnd").value || "17:00",

    usualLocation:
      existing?.usualLocation || {
        lat:null,
        lng:null,
        updatedAt:0
      },

    lastClockGps:
      existing?.lastClockGps || {
        lat:null,
        lng:null,
        updatedAt:0
      },

    createdAt:
      existing?.createdAt || now(),

    updatedAt: now()
  };

  await putJson(
    `companies/${companyCode}/workers/${code}`,
    data
  );

  $("wCode").value = "";
  $("wName").value = "";
  $("wPass").value = "";

  setMsg("workerMsg","保存しました");

  await loadWorkers();
}

$("saveWorkerBtn").addEventListener(
  "click",
  saveWorker
);

document.querySelectorAll(".tabs button")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    switchTab(btn.dataset.tab);

  });

});

$("logoutBtn").addEventListener("click", async ()=>{

  await signOut(auth);

  localStorage.removeItem(
    "smartKintaiAdminCompanyCode"
  );

  location.href = "index.html";
});

$("backBtn").addEventListener("click",()=>{

  location.href = "index.html";

});

function setDefaultMonths(){

  const m = todayMonth();

  $("calMonth").value = m;
  $("attMonth").value = m;
  $("reqMonth").value = m;
  $("errMonth").value = m;
  $("closeMonth").value = m;

}

setDefaultMonths();

requireAdmin();

</script>

</body>
</html>
